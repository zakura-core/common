[[audits.slh-dsa]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.2.0-rc.5"
notes = """
AI-assisted cargo-vet source safety review, not an independent cryptographic or FIPS certification. Exact package archive checksum matched Cargo.lock and registry metadata; packaged files matched reviewed source. Reviewed manifests/features and production source: no build script, hidden filesystem/network/process access or handwritten unsafe; zerocopy address layouts are fixed repr(C) integer-byte fields, parsers check exact lengths, context length is bounded to u8, and allocation/recursion follows fixed parameter sets. Discretion: upstream SigningKey Debug prints secret seed fields, PartialEq compares them without constant-time guarantees, and wrong-length caller-provided opt_rand can panic. Common keeps the upstream key in a private wrapper with no Debug/Eq/Deref/export, takes fixed-length seeds, passes None for opt_rand, and bounds key/signature/context lengths before verification. Approval relies on those upstream hazards remaining unexposed; zeroization of stored seeds is not a claim that all temporary copies are erased.
"""

