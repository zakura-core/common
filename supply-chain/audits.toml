
# cargo-vet audits file

[[audits.const-oid]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.10.2"
notes = """
Reviewed the exact published package and verified its archive checksum and packaged source against Cargo.lock. No build script, FFI, network, process or filesystem capability. The sole unsafe conversion in ObjectIdentifierRef::from_bytes_unchecked preserves lifetime, slice metadata and alignment through a repr(transparent) byte-slice newtype. Public decoding validates arcs first; inspected bounded arc decoding and generated static OID data. AI-assisted source safety review for cargo-vet, not an independent cryptographic or ASN.1 correctness audit.
"""

[[audits.der]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.8.3"
notes = """
Reviewed exact published source and verified its archive checksum and packaged files against Cargo.lock. No build script, network, process execution or hidden filesystem access. Reviewed all four unsafe conversions in bytes.rs, string.rs, asn1/sequence.rs and asn1/octet_string.rs: each casts a borrowed repr(transparent) slice/string wrapper without changing lifetime, alignment or metadata. Inspected checked slice-reader lengths and explicit std file helpers. File paths are caller supplied; existing-file permissions/symlinks remain caller responsibilities and non-Unix secret-file permissions are not hardened. These file helpers are not used by Common PQ validation. AI-assisted cargo-vet safety review; not a complete ASN.1 correctness audit.
"""

