[package]
edition = "2024"
rust-version = "1.88"
name = "zakura-primitives"
version = "1.0.0-rc.4"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust implementations of the Zcash primitives"
homepage = "https://github.com/zakura-core/libraries"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[badges.maintenance]
status = "actively-developed"

[features]
circuits = [
    "orchard/circuit",
    "sapling/circuit",
]
default = [
    "multicore",
    "std",
    "circuits",
]
expensive-tests = []
multicore = [
    "orchard/multicore",
    "sapling/multicore",
]
no-expensive-tests = []
non-standard-fees = []
std = [
    "document-features",
    "redjubjub/std",
    "sapling/std",
    "orchard/std",
    "transparent/std",
]
temporary-zcashd = []
test-dependencies = [
    "dep:proptest",
    "incrementalmerkletree/test-dependencies",
    "orchard/test-dependencies",
    "sapling/test-dependencies",
    "transparent/test-dependencies",
    "zcash_protocol/test-dependencies",
]
transparent-inputs = [
    "transparent/transparent-inputs",
    "dep:secp256k1",
]
zip-233 = []

[lib]
name = "zcash_primitives"
path = "src/lib.rs"
bench = false

[[bench]]
name = "note_decryption"
path = "benches/note_decryption.rs"
harness = false

[dependencies.blake2b_simd]
version = "1"
default-features = false

