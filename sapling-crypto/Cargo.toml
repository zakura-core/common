[package]
edition = "2021"
rust-version = "1.88"
name = "zakura-sapling-crypto"
version = "1.0.0-rc.3"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
exclude = [
    "/.gitignore",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/supply-chain",
]
description = "Cryptographic library for Zcash Sapling"
homepage = "https://github.com/zakura-core/libraries"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"
resolver = "3"

[package.metadata.docs.rs]
features = ["test-dependencies"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
circuit = [
    "dep:bellman",
    "bls12_381/bits",
    "bls12_381/groups",
    "bls12_381/pairings",
    "jubjub/bits",
    "std",
]
default = [
    "multicore",
    "circuit",
]
multicore = ["bellman?/multicore"]
std = [
    "corez/std",
    "dep:document-features",
    "group/wnaf-memuse",
    "redjubjub/std",
]
temporary-zcashd = []
## Caches fused chunk-block Pedersen hash lookup tables (about 6.2 MiB) to
## speed up non-circuit hashing. Opt-in so
## memory-sensitive applications keep the original 8-bit exp-window tables.
fused-pedersen = []
test-dependencies = [
    "incrementalmerkletree/test-dependencies",
    "dep:proptest",
    "rand/std_rng",
]

[lib]
name = "sapling_crypto"
path = "src/lib.rs"

[[bench]]
name = "circuit"
path = "benches/circuit.rs"
harness = false

[[bench]]
name = "pedersen_hash"
path = "benches/pedersen_hash.rs"
harness = false

