[package]
edition = "2021"
rust-version = "1.88"
name = "sapling-crypto"
version = "0.7.0"
authors = [
    "Sean Bowe <sean@electriccoin.co>",
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cryptographic library for Zcash Sapling"
homepage = "https://github.com/zcash/sapling-crypto"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/sapling-crypto"
resolver = "3"

[package.metadata.docs.rs]
features = ["test-dependencies"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
circuit = [
    "dep:bellman",
    "bls12_381/bits",
    "bls12_381/groups",
    "bls12_381/pairings",
    "jubjub/bits",
    "std",
]
default = [
    "multicore",
    "circuit",
]
multicore = ["bellman?/multicore"]
std = [
    "corez/std",
    "dep:document-features",
    "group/wnaf-memuse",
    "redjubjub/std",
]
temporary-zcashd = []
test-dependencies = [
    "incrementalmerkletree/test-dependencies",
    "dep:proptest",
]

[lib]
name = "sapling_crypto"
path = "src/lib.rs"

[[bench]]
name = "circuit"
path = "benches/circuit.rs"
harness = false

[[bench]]
name = "pedersen_hash"
path = "benches/pedersen_hash.rs"
harness = false

[[bench]]
name = "verification"
path = "benches/verification.rs"
harness = false

