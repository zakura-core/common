[package]
edition = "2021"
rust-version = "1.88"
name = "zakura-orchard"
version = "1.0.0-rc.2"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
exclude = [
    "/.gitignore",
    "/AGENTS.md",
    "/rust-toolchain.toml",
]
description = "The Orchard shielded transaction protocol"
documentation = "https://docs.rs/zakura-orchard"
readme = "README.md"
keywords = ["zcash"]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "katex-header.html",
]

[features]
circuit = [
    "dep:halo2_gadgets",
    "dep:halo2_proofs",
    "std",
]
default = [
    "circuit",
    "multicore",
    "std",
]
dev-graph = [
    "halo2_proofs?/dev-graph",
    "image",
    "plotters",
]
multicore = ["halo2_proofs?/multicore"]
std = [
    "corez/std",
    "group/wnaf-memuse",
    "reddsa/std",
]
test-dependencies = [
    "proptest",
    "rand/std",
    "rand/std_rng",
]
unstable-frost = []
unstable-voting-circuits = []
verifier-fingerprint = [
    "circuit",
    "halo2_proofs/unstable-verifier-fingerprint",
]
weighted-merkle = []

[lib]
name = "orchard"
path = "src/lib.rs"
bench = false

[[test]]
name = "builder"
path = "tests/builder.rs"

[[test]]
name = "platform_smoke"
path = "tests/platform_smoke.rs"

[[bench]]
name = "circuit"
path = "benches/circuit.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "note_decryption"
path = "benches/note_decryption.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "small"
path = "benches/small.rs"
harness = false

[[bench]]
name = "merkle"
path = "benches/merkle.rs"
harness = false

[[bench]]
name = "orchard_k11_prover"
path = "benches/orchard_k11_prover.rs"
harness = false
required-features = ["circuit"]

