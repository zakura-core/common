# Zakura's forked cryptography dependencies.
#
# Each member is a fork of a crates.io release, vendored as a plain workspace
# member (no submodules). The members reference each other through the
# [workspace.dependencies] table below (path + version), and Zakura consumes
# them as `git` dependencies on this repository — no `[patch]` indirection, so
# every edge into these crates is an explicit declaration and the crates.io
# originals never enter the graph.
#
# Each member is named after its zakura-branded crates.io reservation (e.g.
# halo2_proofs → zakura-halo2-proofs, zcash_primitives → zakura-primitives;
# see the zakura-core/reserved repository for the full mapping). Directory
# names and library target names keep the upstream names, so `use` paths stay
# unchanged, and intra-workspace edges keep their upstream dependency keys via
# the `package = "zakura-*"` renames declared once in [workspace.dependencies].
#
# Membership rule: the Orchard/halo2/Pallas proving stack, plus every crate in
# Zakura's dependency graph that (transitively) depends on it. The closure must
# stay closed: if a future dependency of Zakura pulls any of these names from
# crates.io, that crate must either be added here or have its edge rewritten,
# or a registry copy will silently coexist with the forks.
#
# - pasta_curves, halo2_proofs, halo2_gadgets, halo2_poseidon,
#   halo2_legacy_pdqsort, orchard: the proving stack itself.
# - pairing, bls12_381, jubjub, bellman: the shared pairing and Groth16
#   foundation used by the Sapling proving stack.
# - sinsemilla, reddsa, redjubjub, sapling-crypto, zcash_proofs: the middle
#   layer between Zakura and the proving stack (reddsa carries the
#   pasta_curves dependency that drags in the Sapling-side crates).
# - zcash_primitives, zcash_keys: the librustzcash members Zakura consumes
#   that depend on the crates above.

[workspace]
resolver = "2"
members = [
    "benchmarks/ios-orchard",
    "crates/bellman",
    "crates/bls12_381",
    "crates/halo2_gadgets",
    "crates/halo2_legacy_pdqsort",
    "crates/halo2_poseidon",
    "crates/halo2_proofs",
    "crates/jubjub",
    "crates/orchard",
    "crates/pairing",
    "crates/pasta_curves",
    "crates/reddsa",
    "crates/redjubjub",
    "crates/sapling-crypto",
    "crates/sinsemilla",
    "crates/zcash_keys",
    "crates/zcash_primitives",
    "crates/zcash_proofs",
]

[workspace.package]
version = "1.0.0-rc.5"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"
# One shared README for every published crate; cargo package copies it into
# each crate as README.md.
readme = "crates/README.md"

# Intra-workspace edges. Every entry pins default-features = false so that a
# member edge fully states what it enables; edges that want a dependency's
# default features list "default" explicitly. Keys mirror the upstream
# dependency names members use in code and feature syntax, so several keys
# alias the same package (halo2_poseidon/poseidon, sapling, zcash_primitives).
[workspace.dependencies]
bellman = { package = "zakura-bellman", version = "1.0.0-rc.5", path = "crates/bellman", default-features = false }
bls12_381 = { package = "zakura-bls12-381", version = "1.0.0-rc.5", path = "crates/bls12_381", default-features = false }
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "1.0.0-rc.5", path = "crates/halo2_gadgets", default-features = false }
halo2_legacy_pdqsort = { package = "zakura-halo2-legacy-pdqsort", version = "1.0.0-rc.5", path = "crates/halo2_legacy_pdqsort", default-features = false }
halo2_poseidon = { package = "zakura-halo2-poseidon", version = "1.0.0-rc.5", path = "crates/halo2_poseidon", default-features = false }
halo2_proofs = { package = "zakura-halo2-proofs", version = "1.0.0-rc.5", path = "crates/halo2_proofs", default-features = false }
jubjub = { package = "zakura-jubjub", version = "1.0.0-rc.5", path = "crates/jubjub", default-features = false }
orchard = { package = "zakura-orchard", version = "1.0.0-rc.5", path = "crates/orchard", default-features = false }
pairing = { package = "zakura-pairing", version = "1.0.0-rc.5", path = "crates/pairing", default-features = false }
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.0-rc.5", path = "crates/pasta_curves", default-features = false }
poseidon = { package = "zakura-halo2-poseidon", version = "1.0.0-rc.5", path = "crates/halo2_poseidon", default-features = false }
reddsa = { package = "zakura-reddsa", version = "1.0.0-rc.5", path = "crates/reddsa", default-features = false }
redjubjub = { package = "zakura-redjubjub", version = "1.0.0-rc.5", path = "crates/redjubjub", default-features = false }
sapling = { package = "zakura-sapling-crypto", version = "1.0.0-rc.5", path = "crates/sapling-crypto", default-features = false }
sinsemilla = { package = "zakura-sinsemilla", version = "1.0.0-rc.5", path = "crates/sinsemilla", default-features = false }
zcash_keys = { package = "zakura-keys", version = "1.0.0-rc.5", path = "crates/zcash_keys", default-features = false }
zcash_primitives = { package = "zakura-primitives", version = "1.0.0-rc.5", path = "crates/zcash_primitives", default-features = false }
zcash_proofs = { package = "zakura-proofs", version = "1.0.0-rc.5", path = "crates/zcash_proofs", default-features = false }
