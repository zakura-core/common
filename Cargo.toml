# The Zakura Common libraries: Zakura's cryptography dependencies.
#
# Published members began as forks of crates.io releases, vendored as plain
# workspace members (no submodules). Members reference each other through the
# [workspace.dependencies] table below (path + version), and Zakura consumes
# them from crates.io under their `zakura-*` names — no `[patch]` indirection,
# so every production edge into these crates is an explicit declaration and the
# upstream crates.io originals never enter the production graph. Test-only
# differential oracles can explicitly depend on published upstream packages.
#
# Each member is named after its zakura-branded crates.io reservation (e.g.
# halo2_proofs → zakura-halo2-proofs, zcash_primitives → zakura-primitives;
# see the zakura-core/reserved repository for the full mapping). Directory
# names and library target names keep the upstream names, so `use` paths stay
# unchanged, and intra-workspace edges keep their upstream dependency keys via
# the `package = "zakura-*"` renames declared once in [workspace.dependencies].
#
# Membership includes the Orchard/halo2/Pallas proving stack, its downstream
# consumers in Zakura, and standalone cryptographic components maintained here.
# The proving-stack closure must stay closed: if a future dependency of Zakura
# pulls any of these names from crates.io, that crate must either be added here
# or have its edge rewritten,
# or a registry copy will silently coexist with the workspace crates.
#
# - equihash: proof-of-work verification and the optional Tromp CPU solver.
# - pasta_curves, halo2_proofs, halo2_gadgets, halo2_poseidon,
#   halo2_legacy_pdqsort, orchard: the proving stack itself.
# - pairing, bls12_381, jubjub, bellman: the shared pairing and Groth16
#   foundation used by the Sapling proving stack.
# - sinsemilla, reddsa, redjubjub, sapling-crypto, zcash_proofs: the middle
#   layer between Zakura and the proving stack (reddsa carries the
#   pasta_curves dependency that drags in the Sapling-side crates).
# - zcash_primitives, zcash_keys: the librustzcash members Zakura consumes
#   that depend on the crates above.
# - zcash_protocol, zcash_address, zcash_transparent, zip321: shared protocol,
#   address, transparent value, and payment request types. They are kept in the
#   same workspace as their public-type consumers so the graph contains one
#   coherent family of types.
# - udon, bento, bento-core, bento-macros: experimental arithmetic and
#   compile-time storage libraries. These remain unpublished and version
#   independently of the coordinated Common release.

[workspace]
# Resolver 3 is resolver 2 plus MSRV-aware version selection: `cargo update`
# and `cargo add` prefer dependency releases whose rust-version fits the 1.91
# MSRV below, so a checkout on the newer development toolchain pinned in
# rust-toolchain.toml cannot silently lock a dependency that the MSRV lanes in
# CI can no longer build. Feature unification is unchanged.
resolver = "3"
members = [
    "crates/bellman",
    "crates/bento",
    "crates/bento-core",
    "crates/bento-macros",
    "crates/bls12_381",
    "crates/equihash",
    "crates/halo2_gadgets",
    "crates/halo2_legacy_pdqsort",
    "crates/halo2_poseidon",
    "crates/halo2_proofs",
    "crates/jubjub",
    "crates/orchard",
    "crates/pairing",
    "crates/pasta_curves",
    "crates/reddsa",
    "crates/reddsa-frost",
    "crates/redjubjub",
    "crates/sapling-crypto",
    "crates/sinsemilla",
    "crates/udon",
    "crates/zcash_address",
    "crates/zcash_keys",
    "crates/zcash_primitives",
    "crates/zcash_protocol",
    "crates/zcash_proofs",
    "crates/zcash_transparent",
    "crates/zip321",
]

[workspace.package]
version = "2.2.0"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
edition = "2024"
# The minimum supported Rust version every published crate promises. It is
# independent of the newer development toolchain pinned in rust-toolchain.toml.
# Raising it is a consumer-visible change (changelog entry required) and must
# move the `cargo +1.91.0` lanes in .github/workflows/ci.yml and
# .github/scripts/check_rust_group.sh with it.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/common"
# One shared README for every published crate; cargo package copies it into
# each crate as README.md.
readme = "crates/README.md"

# Intra-workspace edges. Every entry pins default-features = false so that a
# member edge fully states what it enables; edges that want a dependency's
# default features list "default" explicitly. Keys mirror the upstream
# dependency names members use in code and feature syntax, so several keys
# alias the same package (halo2_poseidon/poseidon, sapling, zcash_primitives).
[workspace.dependencies]
bellman = { package = "zakura-bellman", version = "2.2.0", path = "crates/bellman", default-features = false }
bento = { package = "zakura-bento", version = "0.1.0", path = "crates/bento", default-features = false }
bento-core = { package = "zakura-bento-core", version = "0.1.0", path = "crates/bento-core", default-features = false }
bento-macros = { package = "zakura-bento-macros", version = "0.1.0", path = "crates/bento-macros", default-features = false }
bls12_381 = { package = "zakura-bls12-381", version = "2.2.0", path = "crates/bls12_381", default-features = false }
equihash = { package = "zakura-equihash", version = "2.2.0", path = "crates/equihash", default-features = false }
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "2.2.0", path = "crates/halo2_gadgets", default-features = false }
halo2_legacy_pdqsort = { package = "zakura-halo2-legacy-pdqsort", version = "2.2.0", path = "crates/halo2_legacy_pdqsort", default-features = false }
halo2_poseidon = { package = "zakura-halo2-poseidon", version = "2.2.0", path = "crates/halo2_poseidon", default-features = false }
halo2_proofs = { package = "zakura-halo2-proofs", version = "2.2.0", path = "crates/halo2_proofs", default-features = false }
jubjub = { package = "zakura-jubjub", version = "2.2.0", path = "crates/jubjub", default-features = false }
orchard = { package = "zakura-orchard", version = "2.2.0", path = "crates/orchard", default-features = false }
pairing = { package = "zakura-pairing", version = "2.2.0", path = "crates/pairing", default-features = false }
pasta_curves = { package = "zakura-pasta-curves", version = "2.2.0", path = "crates/pasta_curves", default-features = false }
poseidon = { package = "zakura-halo2-poseidon", version = "2.2.0", path = "crates/halo2_poseidon", default-features = false }
reddsa = { package = "zakura-reddsa", version = "3.0.0", path = "crates/reddsa", default-features = false }
redjubjub = { package = "zakura-redjubjub", version = "2.2.0", path = "crates/redjubjub", default-features = false }
sapling = { package = "zakura-sapling-crypto", version = "2.2.0", path = "crates/sapling-crypto", default-features = false }
sinsemilla = { package = "zakura-sinsemilla", version = "2.2.0", path = "crates/sinsemilla", default-features = false }
udon = { package = "zakura-udon", version = "0.1.0", path = "crates/udon", default-features = false }
zcash_address = { package = "zakura-address", version = "2.2.0", path = "crates/zcash_address", default-features = false }
zcash_keys = { package = "zakura-keys", version = "2.2.0", path = "crates/zcash_keys", default-features = false }
zcash_primitives = { package = "zakura-primitives", version = "2.2.0", path = "crates/zcash_primitives", default-features = false }
zcash_protocol = { package = "zakura-protocol", version = "2.2.0", path = "crates/zcash_protocol", default-features = false }
zcash_proofs = { package = "zakura-proofs", version = "2.2.0", path = "crates/zcash_proofs", default-features = false }
transparent = { package = "zakura-transparent", version = "2.2.0", path = "crates/zcash_transparent", default-features = false }
zip321 = { package = "zakura-zip321", version = "2.2.0", path = "crates/zip321", default-features = false }

# Parsing and encoding dependencies used by ZIP 321 payment requests.
base64 = "0.22"
nom = "7"
percent-encoding = "2.1.0"
proptest = ">=1,<1.7"

# The differential matrix hashes many valid subtrees with both implementations.
# Optimize those test targets while retaining test-profile assertions/checks.
[profile.test.package.zakura-equihash]
opt-level = 3

[profile.test.package.equihash]
opt-level = 3
