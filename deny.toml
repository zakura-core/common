# Configuration file for cargo-deny.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = [
    # Existing version splits inherited from the imported upstream crates.
    # Keep each exception exact so a new duplicate version still fails CI.
    { name = "bitflags", version = "=1.3.2" },
    { name = "block-buffer", version = "=0.11.0-rc.3" },
    # The ff/group 0.14 stack uses rand 0.10, while external Zcash and FROST
    # dependencies still expose rand_core 0.6 and rand 0.8 APIs.
    { name = "chacha20", version = "=0.9.1" },
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "crypto-common", version = "=0.2.0-rc.1" },
    { name = "digest", version = "=0.11.0-pre.9" },
    { name = "getrandom", version = "=0.2.17" },
    { name = "gif", version = "=0.11.4" },
    { name = "hmac", version = "=0.12.1" },
    { name = "itertools", version = "=0.10.5" },
    { name = "itertools", version = "=0.13.0" },
    { name = "rand", version = "=0.8.7" },
    { name = "rand_core", version = "=0.6.4" },
    { name = "ripemd", version = "=0.1.3" },
    { name = "sha2", version = "=0.10.9" },
    { name = "syn", version = "=1.0.109" },
    { name = "syn", version = "=2.0.119" },
    { name = "windows-sys", version = "=0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/zcash/librustzcash.git"]
