[[bench]]
name = "glv_table"
path = "benches/glv_table.rs"
harness = false
required-features = ["glv"]

[[bench]]
name = "hashtocurve"
path = "benches/hashtocurve.rs"
harness = false
required-features = ["alloc"]

[[bench]]
name = "point"
path = "benches/point.rs"
harness = false
required-features = ["alloc"]

