[package]
edition = "2021"
rust-version = "1.88"
name = "zakura-pasta-curves"
version = "1.0.0-rc.3"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
exclude = [
    "/.gitignore",
    "/rust-toolchain.toml",
    "/sage",
]
description = "Implementation of the Pallas and Vesta (Pasta) curve cycle"
documentation = "https://docs.rs/zakura-pasta-curves"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "katex-header.html",
]

[features]
aarch64-asm = ["dep:cc"]
# MULX/ADCX/ADOX Montgomery multiplication for the Pasta fields on x86-64.
# Requires a CPU with the BMI2 and ADX extensions (Intel Broadwell / AMD Zen
# or later); enabling it on an older CPU faults at runtime. A no-op on other
# architectures.
x86_64-asm = []
alloc = [
    "group/alloc",
    "blake2b_simd",
]
bits = ["ff/bits"]
default = [
    "bits",
    "sqrt-table",
]
deferred = []
glv = ["alloc"]
gpu = [
    "alloc",
    "ec-gpu",
]
# Parallel evaluation of the GLV multiscalar windows and affine batches in
# `glv.rs` through the Rayon pool; implies `glv` (and therefore `alloc`).
multicore = [
    "glv",
    "dep:maybe-rayon",
    "maybe-rayon/threads",
]
# The Eisenstein-orbit MSM backend (`glv::orbit`, planned against the
# Signed-Booth backend per input) and the prepared fixed-base zero-checks
# (`glv::zero`, exposed through `CurveExt::try_prepare_zero_check`).
# Without it the arbitrary-scalar MSM plans the Signed-Booth backend alone.
orbits = ["glv"]
repr-c = []
serde = [
    "hex",
    "serde_crate",
]
sqrt-table = [
    "alloc",
    "dep:once_cell",
]
uninline-portable = []

[lib]
name = "pasta_curves"
path = "src/lib.rs"

[[bench]]
name = "fp"
path = "benches/fp.rs"
harness = false

