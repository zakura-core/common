name: Rust build cache
description: Cache Cargo dependencies and content-addressed compiler outputs

inputs:
  key:
    description: Stable dependency-cache bucket for this job's build configurations
    required: true

runs:
  using: composite
  steps:
    - name: Configure compiler cache
      shell: bash
      env:
        WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        if [[ "$WRITE_CACHE" == true ]]; then
          echo 'SCCACHE_GHA_RW_MODE=READ_WRITE' >> "$GITHUB_ENV"
        else
          echo 'SCCACHE_GHA_RW_MODE=READ_ONLY' >> "$GITHUB_ENV"
        fi
    - name: Install compiler cache
      id: sccache
      # An unavailable release download must not prevent the checks from running.
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Enable compiler wrapper
      if: steps.sccache.outcome == 'success'
      shell: bash
      run: echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
    - name: Restore Cargo dependency cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.key }}
        add-job-id-key: false
        cache-bin: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
