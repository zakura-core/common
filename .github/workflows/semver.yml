# Gate changes against the latest stable crates.io release of every workspace
# crate. Explicitly excluded unused features are outside the compatibility promise.
name: Semver policy

on:
  pull_request:
    branches: [main, "feat/**", "release/**", "agent/**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/scripts/affected_semver_packages.py
      - .github/scripts/test_affected_semver_packages.py
      - .github/workflows/semver.yml
      - .github/semver-feature-exceptions.toml
      - .github/scripts/check_semver.py
      - .github/scripts/test_check_semver.py
      - .github/scripts/test_check_semver_integration.py
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/scripts/affected_semver_packages.py
      - .github/scripts/test_affected_semver_packages.py
      - .github/workflows/semver.yml
      - .github/semver-feature-exceptions.toml
      - .github/scripts/check_semver.py
      - .github/scripts/test_check_semver.py
      - .github/scripts/test_check_semver_integration.py
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semver-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select-packages:
    name: select semver packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_packages: ${{ steps.packages.outputs.has_packages }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected publishable packages
        id: packages
        shell: bash
        env:
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/test_affected_semver_packages.py
          python3 .github/scripts/test_check_semver.py

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha=$(git rev-parse "${PR_MERGE_SHA}^1")
              packages=$(python3 .github/scripts/affected_semver_packages.py \
                --base "$base_sha" --head "$PR_MERGE_SHA")
              ;;
            merge_group)
              packages=$(python3 .github/scripts/affected_semver_packages.py \
                --base "$MERGE_BASE_SHA" --head "$MERGE_HEAD_SHA")
              ;;
            *)
              packages=$(python3 .github/scripts/affected_semver_packages.py --all)
              ;;
          esac

          packages_json=$(printf '%s\n' "$packages" | jq -Rsc \
            'split("\n") | map(select(length > 0))')
          {
            echo "has_packages=$([[ -n "$packages" ]] && echo true || echo false)"
            echo "packages=$packages_json"
          } >> "$GITHUB_OUTPUT"

  semver:
    name: semver (${{ matrix.package }})
    if: needs.select-packages.outputs.has_packages == 'true'
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          # Match Zakura's deliberate exception to tool-version pinning:
          # cargo-semver-checks must track stable rustdoc format changes.
          tool: cargo-semver-checks

      - name: Test semver exception boundaries
        if: matrix.package == 'zakura-primitives'
        run: python3 .github/scripts/test_check_semver_integration.py

      - name: Check public API compatibility
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 .github/scripts/check_semver.py --package "$PACKAGE"

  semver-checks:
    name: semver-checks
    if: always()
    needs: [select-packages, semver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check semver job results
        env:
          HAS_PACKAGES: ${{ needs.select-packages.outputs.has_packages }}
          SELECT_RESULT: ${{ needs.select-packages.result }}
          SEMVER_RESULT: ${{ needs.semver.result }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "Package selection failed: $SELECT_RESULT" >&2
            exit 1
          fi
          if [[ "$HAS_PACKAGES" == true && "$SEMVER_RESULT" != success ]]; then
            echo "Package checks failed: $SEMVER_RESULT" >&2
            exit 1
          fi
