name: Publish crates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify packages and authentication, or publish the manifest versions"
        type: choice
        required: true
        default: verify
        options: [verify, publish]

permissions: {}

concurrency:
  group: common-crates-io
  cancel-in-progress: false

jobs:
  plan-verify:
    name: Plan and verify crate publication
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a main dispatch in the release repository
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$REPOSITORY" != "zakura-core/common" ] || [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "Dispatch this workflow from main in zakura-core/common." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release_ci.py --repository "$REPOSITORY" --commit "$RELEASE_SHA" --check-environment
      - name: Select the pinned toolchain
        run: |
          python3 -c 'import tomllib'
          rustup show
      - name: Verify unpublished packages against registry dependencies without credentials
        run: python3 .github/scripts/publish_crates.py verify --output "$RUNNER_TEMP/verification.json"
      - name: Summarize verification
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/verification.json" ]; then
            python3 .github/scripts/publish_crates.py summary --receipt "$RUNNER_TEMP/verification.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain verification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-verification
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          overwrite: true

  oidc-smoke:
    name: Exchange and revoke the crates.io token
    needs: plan-verify
    if: ${{ inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: crates-io
    permissions:
      id-token: write
    steps:
      # This job runs at github.sha; it needs no checkout and exposes no token.
      # The action post step revokes the token, including in verify mode.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

  publish:
    name: Publish and confirm crate versions
    needs: plan-verify
    if: ${{ inputs.mode == 'publish' && github.repository == 'zakura-core/common' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-verification
          path: ${{ runner.temp }}/verified
      - name: Select the pinned toolchain before authentication
        run: rustup show
      - name: Validate the receipt against this clean checkout
        run: |
          python3 .github/scripts/publish_crates.py validate \
            --receipt "$RUNNER_TEMP/verified/verification.json" \
            --output "$RUNNER_TEMP/validation.json"
      # Only the next upload step receives the temporary token. The action
      # revokes it in its post step when the job finishes.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 .github/scripts/publish_crates.py publish \
            --receipt "$RUNNER_TEMP/verified/verification.json" \
            --output "$RUNNER_TEMP/publication.json" --run-id "$RUN_ID"
      - name: Confirm registry versions and workflow attribution
        if: ${{ always() }}
        env:
          RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ -f "$RUNNER_TEMP/publication.json" ]; then
            python3 .github/scripts/publish_crates.py confirm --receipt "$RUNNER_TEMP/publication.json" \
              --run-id "$RUN_ID" --commit "$RELEASE_SHA"
          else
            echo "No publication receipt was produced; publication did not complete." >&2
            exit 1
          fi
      - name: Summarize partial or completed publication
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/publication.json" ]; then
            python3 .github/scripts/publish_crates.py summary --receipt "$RUNNER_TEMP/publication.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publication stopped before a receipt was produced. See the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain publication progress
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: warn
