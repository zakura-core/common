  # zcash/librustzcash .github/workflows/ci.yml @
  # 82fa052a06e3af0058a73f320538f9b93193439c
  librustzcash-test:
    name: librustzcash subset / Test all features
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_DEBUG: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Run tests
        run: >-
          cargo +1.88.0 test
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-features
          -- --test-threads=2
      - name: Verify working directory is clean
        run: git diff --exit-code

  librustzcash-configurations:
    name: librustzcash subset / Configuration checks
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          components: clippy
      - name: Check no-default-features
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --no-default-features
      - name: Check transparent-inputs-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --no-default-features
          --features zakura-keys/transparent-inputs,zakura-primitives/transparent-inputs
      - name: Check transparent-key-encoding-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --no-default-features
          --features zakura-keys/transparent-key-encoding
      - name: Check Sapling-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --no-default-features
          --features zakura-keys/sapling,zakura-primitives/circuits
      - name: Check Orchard
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --no-default-features
          --features zakura-keys/orchard,zakura-primitives/circuits
      - name: Check all-features
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.88.0 check
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --all-features
      - name: Clippy each feature of each imported crate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for package in zakura-keys zakura-primitives zakura-proofs; do
            cargo +1.88.0 metadata --no-deps --format-version 1 |
              jq -r --arg package "$package" \
                '.packages[] | select(.name == $package) | .features | keys[]' |
              while IFS= read -r feature; do
                cargo +1.88.0 clippy -p "$package" \
                  --no-deps \
                  --no-default-features \
                  --features "$feature"
              done
          done
      - name: Install beta Clippy
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dtolnay/rust-toolchain@482f49bd06e5fc9083e4fd71e1327793b1c839fe # beta
        with:
          components: clippy
      - name: Clippy on beta
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          cargo +beta clippy
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --no-deps
          --all-features
          --all-targets
          -- -W clippy::all

  librustzcash-no-std:
    name: librustzcash subset / Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            packages: -p zakura-proofs
            build-deps: gcc-multilib
          - target: thumbv7em-none-eabihf
            packages: -p zakura-keys -p zakura-primitives
            build-deps: gcc-arm-none-eabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-platform support dependencies
        if: matrix.build-deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.build-deps }}
      - name: Build target
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGET: ${{ matrix.target }}
        run: cargo +1.88.0 build $PACKAGES --no-default-features --target "$TARGET" --verbose

  test-success:
    name: test success
    if: always()
    needs:
      - changes
      - rust-checks
      - formatting
      - halo2-test
      - halo2-platform-smoke
      - halo2-test-32-bit
      - halo2-build
      - orchard-test
      - orchard-platform-smoke
      - orchard-no-std
      - pasta-test
      - pasta-platform-smoke
      - pasta-test-32-bit
      - pasta-no-std
      - reddsa-test
      - reddsa-no-std
      - redjubjub-test
      - redjubjub-no-std
      - sapling-test
      - sapling-platform-smoke
      - sapling-no-std
      - librustzcash-test
      - librustzcash-configurations
      - librustzcash-no-std
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # Every job except the detector is path-gated. A skipped job is valid,
          # but a failed or cancelled job must still fail this aggregate status.
          allowed-skips: >-
            rust-checks,
            formatting,
            halo2-test,
            halo2-platform-smoke,
            halo2-test-32-bit,
            halo2-build,
            orchard-test,
            orchard-platform-smoke,
            orchard-no-std,
            pasta-test,
            pasta-platform-smoke,
            pasta-test-32-bit,
            pasta-no-std,
            reddsa-test,
            reddsa-no-std,
            redjubjub-test,
            redjubjub-no-std,
            sapling-test,
            sapling-platform-smoke,
            sapling-no-std,
            librustzcash-test,
            librustzcash-configurations,
            librustzcash-no-std
