name: CI

# The test and cross-target suites below are adapted from each upstream
# repository's primary CI workflow at the revision noted below. Book jobs are
# omitted; API documentation is built once for the whole workspace (docs-build)
# rather than per upstream, with extra Udon feature-specific doc checks.
# Shared lint, formatting, and MSRV checks use the
# same policy as zakura-core/zakura.

on:
  # Allow maintainers to toggle the ci-backfill label when an unchanged PR
  # needs a fresh required test success check.
  pull_request:
    branches: [main, "feat/**", "perf/**", "release/**", "agent/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed upstreams
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      equihash: ${{ steps.filter.outputs.equihash }}
      halo2: ${{ steps.filter.outputs.halo2 }}
      orchard: ${{ steps.filter.outputs.orchard }}
      pasta_curves: ${{ steps.filter.outputs.pasta_curves }}
      reddsa: ${{ steps.filter.outputs.reddsa }}
      redjubjub: ${{ steps.filter.outputs.redjubjub }}
      sapling_crypto: ${{ steps.filter.outputs.sapling_crypto }}
      sensei: ${{ steps.filter.outputs.sensei }}
      sinsemilla: ${{ steps.filter.outputs.sinsemilla }}
      librustzcash: ${{ steps.filter.outputs.librustzcash }}
      udon: ${{ steps.filter.outputs.udon }}
      rust_checks: ${{ steps.filter.outputs.rust_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed paths to upstream repositories
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base_sha=$PR_BASE_SHA
              head_sha=$PR_HEAD_SHA
              ;;
            push)
              base_sha=$PUSH_BASE_SHA
              head_sha=$PUSH_HEAD_SHA
              ;;
            merge_group)
              base_sha=$MERGE_BASE_SHA
              head_sha=$MERGE_HEAD_SHA
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            # Diff a new ref, or an unreachable pre-force-push base, from the
            # empty tree. The root manifest then conservatively selects all suites.
            base_sha=$(git hash-object -t tree /dev/null)
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha=$(git merge-base "$base_sha" "$head_sha")
          fi
          changed=$(git diff --name-only --no-renames "$base_sha" "$head_sha")

          equihash=false
          halo2=false
          orchard=false
          pasta_curves=false
          reddsa=false
          redjubjub=false
          sapling_crypto=false
          sensei=false
          sinsemilla=false
          librustzcash=false
          udon=false
          shared=false

          # Trip on workspace membership drift so maintainers revisit this
          # array, the path-routing cases, and the reverse-dependency graph
          # together. This does not prove those three mappings are equivalent.
          handled_members=(
            crates/bellman
            crates/bento
            crates/bento-core
            crates/bento-macros
            crates/bls12_381
            crates/equihash
            crates/halo2_gadgets
            crates/halo2_poseidon
            crates/halo2_proofs
            crates/jubjub
            crates/orchard
            crates/orchard-legacy
            crates/pairing
            crates/pasta_curves
            crates/reddsa
            crates/reddsa-frost
            crates/redjubjub
            crates/sapling-crypto
            crates/sensei
            crates/sensei-artifacts
            crates/sensei-macros
            crates/sensei-shared
            crates/sinsemilla
            crates/udon
            crates/zcash_address
            crates/zcash_keys
            crates/zcash_note_encryption
            crates/zcash_primitives
            crates/zcash_protocol
            crates/zcash_proofs
            crates/zcash_transparent
            crates/zip321
          )
          workspace_packages=$(python3 .github/scripts/workspace_packages.py)
          workspace_members=()
          while IFS= read -r member; do
            workspace_members+=("$member")
          done < <(jq -r '.[].directory' <<< "$workspace_packages")
          if ! diff -u \
            <(printf '%s\n' "${handled_members[@]}" | sort) \
            <(printf '%s\n' "${workspace_members[@]}" | sort); then
            echo "Workspace membership changed; update all CI routing mappings" >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              crates/bento/*|crates/bento-core/*|crates/bento-macros/*|crates/udon/*|.github/scripts/check_udon_fixtures.py)
                udon=true
                ;;
              crates/equihash/*)
                equihash=true
                ;;
              crates/halo2_gadgets/*|crates/halo2_poseidon/*|crates/halo2_proofs/*|.github/fixtures/ironwood-circuits.sha256)
                halo2=true
                ;;
              crates/orchard/*|crates/orchard-legacy/*)
                orchard=true
                ;;
              crates/pasta_curves/*)
                pasta_curves=true
                ;;
              crates/reddsa/*|crates/reddsa-frost/*)
                reddsa=true
                ;;
              crates/redjubjub/*)
                redjubjub=true
                ;;
              crates/bellman/*|crates/bls12_381/*|crates/jubjub/*|crates/pairing/*)
                # These crates form the shared Sapling/Groth16 foundation.
                # Jubjub also feeds RedDSA, so conservatively run both stacks
                # for changes to any member of this tightly-coupled group.
                reddsa=true
                sapling_crypto=true
                ;;
              crates/zcash_note_encryption/*)
                # Shared cryptographic implementation: exercise both domains
                # and their transaction/key consumers.
                orchard=true
                sapling_crypto=true
                librustzcash=true
                ;;
              crates/sapling-crypto/*)
                sapling_crypto=true
                ;;
              crates/sensei/*|crates/sensei-artifacts/*|crates/sensei-macros/*|crates/sensei-shared/*)
                sensei=true
                ;;
              crates/sinsemilla/*)
                sinsemilla=true
                ;;
              crates/zcash_address/*|crates/zcash_keys/*|crates/zcash_primitives/*|crates/zcash_protocol/*|crates/zcash_proofs/*|crates/zcash_transparent/*|crates/zip321/*)
                librustzcash=true
                ;;
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|.github/scripts/check_rust_group.sh|.github/scripts/workspace_packages.py|.github/workflows/ci.yml|.github/workflows/maintenance.yml)
                shared=true
                ;;
            esac
          done <<< "$changed"

          if [[ "$shared" == true ]]; then
            equihash=true
            halo2=true
            orchard=true
            pasta_curves=true
            reddsa=true
            redjubjub=true
            sapling_crypto=true
            sensei=true
            sinsemilla=true
            librustzcash=true
            udon=true
          fi

          # Expand changed packages through the workspace's reverse-dependency
          # graph. Keep these assignments ordered from foundational crates to
          # their downstream consumers so each transitive edge is applied. The
          # member check above catches new crates; update this graph when a
          # workspace path-dependency edge changes.
          if [[ "$udon" == true ]]; then
            sensei=true
          fi
          if [[ "$sensei" == true ]]; then
            orchard=true
            reddsa=true
          fi
          if [[ "$pasta_curves" == true ]]; then
            halo2=true
            reddsa=true
            sinsemilla=true
          fi
          if [[ "$sinsemilla" == true ]]; then
            halo2=true
            orchard=true
          fi
          if [[ "$halo2" == true ]]; then
            orchard=true
          fi
          if [[ "$reddsa" == true ]]; then
            redjubjub=true
            orchard=true
          fi
          if [[ "$redjubjub" == true ]]; then
            sapling_crypto=true
          fi
          if [[ "$orchard" == true ]]; then
            librustzcash=true
            # Sensei's verification tests embed Orchard's circuit fixtures.
            sensei=true
          fi
          if [[ "$equihash" == true ]]; then
            librustzcash=true
          fi
          if [[ "$sapling_crypto" == true ]]; then
            librustzcash=true
          fi

          rust_checks=false
          if [[ "$equihash" == true ||
            "$halo2" == true ||
            "$orchard" == true ||
            "$pasta_curves" == true ||
            "$reddsa" == true ||
            "$redjubjub" == true ||
            "$sapling_crypto" == true ||
            "$sensei" == true ||
            "$sinsemilla" == true ||
            "$librustzcash" == true ||
            "$udon" == true ]]; then
            rust_checks=true
          fi

          {
            echo "equihash=$equihash"
            echo "halo2=$halo2"
            echo "orchard=$orchard"
            echo "pasta_curves=$pasta_curves"
            echo "reddsa=$reddsa"
            echo "redjubjub=$redjubjub"
            echo "sapling_crypto=$sapling_crypto"
            echo "sensei=$sensei"
            echo "sinsemilla=$sinsemilla"
            echo "librustzcash=$librustzcash"
            echo "udon=$udon"
            echo "rust_checks=$rust_checks"
          } >> "$GITHUB_OUTPUT"

  rust-checks:
    name: Rust checks (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Groups run as parallel jobs, balanced by their check time. Each
        # step below names its group.
        group: [Udon and equihash, halo2 and Orchard, Sapling and librustzcash, Sensei]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # One package per invocation: a grouped invocation lets Cargo unify
      # features across the group, masking a package that cannot build
      # against its own manifest alone.
      - name: zakura-equihash / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Udon and equihash' && needs.changes.outputs.equihash == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-equihash true false
      - name: halo2 / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'halo2 and Orchard' && needs.changes.outputs.halo2 == 'true' }}
        run: |
          bash .github/scripts/check_rust_group.sh zakura-halo2-gadgets false false
          bash .github/scripts/check_rust_group.sh zakura-halo2-poseidon false false
          bash .github/scripts/check_rust_group.sh zakura-halo2-proofs false false
      - name: orchard / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'halo2 and Orchard' && needs.changes.outputs.orchard == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-orchard true false
      - name: pasta_curves / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'halo2 and Orchard' && needs.changes.outputs.pasta_curves == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-pasta-curves false false
      - name: reddsa / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.reddsa == 'true' }}
        run: bash .github/scripts/check_rust_group.sh 'zakura-reddsa zakura-reddsa-frost' false false
      - name: redjubjub / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.redjubjub == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-redjubjub false false
      - name: Sapling foundation / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.sapling_crypto == 'true' }}
        run: >-
          bash .github/scripts/check_rust_group.sh
          "zakura-pairing zakura-bls12-381 zakura-jubjub zakura-bellman"
          false true
      - name: BLS12-381 / Experimental feature check
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.sapling_crypto == 'true' }}
        run: >-
          cargo +1.97.0 check --locked -p zakura-bls12-381
          --no-default-features --features experimental
      - name: sapling-crypto / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.sapling_crypto == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-sapling-crypto true false
      - name: sinsemilla / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'halo2 and Orchard' && needs.changes.outputs.sinsemilla == 'true' }}
        run: bash .github/scripts/check_rust_group.sh zakura-sinsemilla false true
      - name: Note encryption / Feature-off checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.librustzcash == 'true' }}
        run: |
          cargo +1.97.0 check --locked -p zakura-note-encryption --no-default-features
          cargo +1.97.0 check --locked -p zakura-note-encryption --no-default-features --features alloc
          cargo +1.97.0 check --locked -p zakura-note-encryption --no-default-features --features pre-zip-212
      - name: librustzcash / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sapling and librustzcash' && needs.changes.outputs.librustzcash == 'true' }}
        run: >-
          bash .github/scripts/check_rust_group.sh
          "zakura-keys zakura-note-encryption zakura-primitives zakura-protocol zakura-proofs zakura-zip321" true false

      - name: Udon and Bento / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Udon and equihash' && needs.changes.outputs.udon == 'true' }}
        run: |
          bash .github/scripts/check_rust_group.sh zakura-bento-core true false
          bash .github/scripts/check_rust_group.sh zakura-bento-macros true false
          bash .github/scripts/check_rust_group.sh zakura-bento true false
          bash .github/scripts/check_rust_group.sh zakura-udon true false
      - name: Udon and Bento / MSRV feature check
        if: ${{ !cancelled() && matrix.group == 'Udon and equihash' && needs.changes.outputs.udon == 'true' }}
        run: |
          cargo +1.97.0 check --locked --all-features --all-targets \
            -p zakura-bento-core -p zakura-bento-macros -p zakura-bento -p zakura-udon
          # `--all-features` enables `portable`, which hides the x86-64 assembly.
          cargo +1.97.0 check --locked --features x86_64-asm --all-targets -p zakura-udon

      - name: Sensei / Stable and MSRV checks
        if: ${{ !cancelled() && matrix.group == 'Sensei' && needs.changes.outputs.sensei == 'true' }}
        run: |
          bash .github/scripts/check_rust_group.sh zakura-sensei-shared true false
          bash .github/scripts/check_rust_group.sh zakura-sensei-artifacts true false
          bash .github/scripts/check_rust_group.sh zakura-sensei-macros true false
          bash .github/scripts/check_rust_group.sh zakura-sensei true false
      - name: Sensei / MSRV feature check
        if: ${{ !cancelled() && matrix.group == 'Sensei' && needs.changes.outputs.sensei == 'true' }}
        run: |
          cargo +1.97.0 check --locked --all-features --all-targets -p zakura-sensei
          # `--all-features` enables `portable`, which hides the x86-64 assembly.
          cargo +1.97.0 check --locked --features x86_64-asm --all-targets -p zakura-sensei

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned nightly; action uses orphan commits
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
      - name: Check standalone Udon and Bento fixtures
        if: needs.changes.outputs.udon == 'true'
        run: python3 .github/scripts/check_udon_fixtures.py

  # zcash/halo2 .github/workflows/ci.yml @
  # 723a90bc598d986bdf59941a8011c60a0819d6b9
  halo2-test:
    name: halo2 / Test on Linux${{ matrix.name_suffix }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [stable, nightly]
        include:
          - stage: stable
            features: ""
            name_suffix: ""
          - stage: nightly
            features: nightly
            name_suffix: " with nightly features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run tests
        shell: bash
        env:
          STAGE_FEATURE: ${{ matrix.features }}
        run: |
          # `orbits` (off by default) is enabled here so this job's
          # runtime coverage includes the prepared zero-check path
          # (the msm unit tests and plonk_api's K = 7 block route through
          # it; plonk_api's pinned K = 5 verifications exceed the extras
          # guard and cover the armed-but-guarded fallback); the 32-bit
          # and platform-smoke jobs run without it and cover the
          # default orbits-off fallback.
          features=batch,dev-graph,gadget-traces,test-dependencies,orbits
          if [[ -n "$STAGE_FEATURE" ]]; then
            features="$features,$STAGE_FEATURE"
          fi
          cargo +stable test --verbose --release \
            -p zakura-halo2-gadgets \
            -p zakura-halo2-poseidon \
            -p zakura-halo2-proofs \
            --no-default-features \
            --features "$features"
      - name: Verify working directory is clean
        run: git diff --exit-code

  halo2-platform-smoke:
    name: halo2 / Platform smoke test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Compile tests
        run: >-
          cargo +stable test --verbose --release
          -p zakura-halo2-gadgets
          -p zakura-halo2-poseidon
          -p zakura-halo2-proofs
          --no-default-features
          --features batch,dev-graph,gadget-traces,test-dependencies
          --no-run
      - name: Test platform randomness and polynomial arithmetic
        run: >-
          cargo +stable test --verbose --release
          -p zakura-halo2-gadgets
          -p zakura-halo2-poseidon
          -p zakura-halo2-proofs
          --no-default-features
          --features batch,dev-graph,gadget-traces,test-dependencies
          poly::domain::test_rotate
          -- --exact
      - name: Verify working directory is clean
        run: git diff --exit-code

  halo2-test-32-bit:
    name: halo2 / Test i686${{ matrix.name_suffix }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: stable
            name_suffix: ""
          - stage: nightly
            name_suffix: " with nightly features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          targets: i686-unknown-linux-gnu
      - name: Install cross-platform support dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run tests
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          features=batch,dev-graph,gadget-traces,test-dependencies
          if [[ "$STAGE" != stable ]]; then
            features="$features,$STAGE"
          fi
          # This job is a 32-bit portability gate, not a full regression
          # suite: it exists to exercise pointer-width-dependent code
          # (PrimeFieldBits' u32 limbs, usize assumptions, u128 lowering)
          # and proof (de)serialization on a 32-bit target. The skipped
          # tests below are the handful of multi-minute MockProver /
          # constant-generation tests; they re-run arithmetic that the
          # remaining tests already cover and account for ~90% of this
          # job's runtime (the full suite runs on x86_64 above). All
          # stored-proof verifier tests, the real prove-and-verify path
          # (halo2_proofs plonk tests), and one MockProver satisfaction
          # test per chip still run here. Note --skip matches substrings,
          # so ecc_chip and invalid_magnitude_sign also cover their
          # _4_5b variants.
          cargo +1.97.0 test --verbose --release \
            -p zakura-halo2-gadgets \
            -p zakura-halo2-poseidon \
            -p zakura-halo2-proofs \
            --target i686-unknown-linux-gnu \
            --no-default-features \
            --features "$features" \
            -- \
            --skip ecc::chip::constants::tests::lagrange_coeffs \
            --skip ecc::chip::constants::tests::zs_and_us \
            --skip ecc::chip::mul_fixed::short::tests::invalid_magnitude_sign \
            --skip ecc::tests::ecc_chip \
            --skip sinsemilla::tests::sinsemilla_chip \
            --skip utilities::lookup_range_check::tests::short_range_check

  halo2-build:
    name: halo2 / Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          targets: ${{ matrix.target }}
      - name: Build target
        run: >-
          cargo +1.97.0 build
          -p zakura-halo2-gadgets
          -p zakura-halo2-poseidon
          -p zakura-halo2-proofs
          --target ${{ matrix.target }}
          --no-default-features
          --features batch,dev-graph,gadget-traces,nightly

  docs-build:
    name: API docs / Build with docsrs cfg
    needs: changes
    if: needs.changes.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned nightly; action uses orphan commits
      - name: Install build dependencies
        # --all-features enables plotters' TTF text rendering, which links the
        # system fontconfig (same as the rust-checks all-feature check).
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Build API documentation
        # Use supported default backend features and --cfg docsrs, which
        # several crates use for doc_cfg feature badges, so that a
        # docs.rs build failure surfaces here instead of after publishing.
        # The katex-header.html injection is static HTML and needs no check.
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: >-
          cargo +nightly doc --workspace --no-deps
          --features "$(python3 .github/scripts/supported_features.py --workspace)"
          --locked --verbose

  # zcash/orchard .github/workflows/ci.yml @
  # 3f7ebf716a04bb76f35afe9fa5296064fcd451ca
  orchard-test:
    name: orchard / Test on Linux
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run tests
        run: cargo +stable test -p zakura-orchard --verbose
      - name: Test composition witness encodings
        run: cargo +stable test -p zakura-orchard --locked --features circuit-composition --lib composition_tests
      - name: Test public circuit composition without default features
        run: cargo +stable test -p zakura-orchard --locked --no-default-features --features circuit-composition,test-dependencies --test composition_api
      - name: Test composition API privacy documentation
        run: cargo +stable test -p zakura-orchard --locked --features circuit-composition --doc circuit::composition
      - name: Test without indexed ZIP 32 addresses
        run: >-
          cargo +stable test -p zakura-orchard --locked
          --no-default-features --features backend-halo2 --features circuit,multicore,wallet
      - name: Verify working directory is clean
        run: git diff --exit-code

  orchard-weighted-test:
    name: orchard / Test weighted Merkle on Linux
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run weighted-merkle library tests
        # The weighted-merkle feature is not in the crate defaults, so its
        # gated tests (e.g. the weighted/unweighted Merkle equivalence
        # proptest in tree.rs) never execute under the default-feature job.
        # They live in the library target, so --lib runs only the lib suite
        # with the feature enabled rather than the integration tests.
        run: >-
          cargo +stable test -p zakura-orchard
          --features weighted-merkle
          --lib
          --verbose
      - name: Verify working directory is clean
        run: git diff --exit-code

  ironwood-fixtures:
    name: halo2 / Test Ironwood fixture exporters (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.halo2 == 'true' || needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        # The parts need separate release builds, so they run in parallel.
        # Every step that writes a pinned output stays in `circuit fixtures`,
        # whose final comparison needs all ten outputs.
        part: [proof bytes, circuit fixtures]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Test proof-byte verifier fixture exports
        if: matrix.part == 'proof bytes'
        run: >-
          cargo +stable test --locked --release -p zakura-halo2-proofs
          --features unstable-verifier-fingerprint
          --test fingerprint_export
      - name: Test transcript-read serialization
        if: matrix.part == 'proof bytes'
        run: >-
          cargo +stable test --locked --release -p zakura-halo2-proofs
          --features unstable-verifier-fingerprint
          --lib plonk::fingerprint::vesta_lean::
      - name: Test Orchard captures and malformed proof encodings
        if: matrix.part == 'circuit fixtures'
        run: >-
          cargo +stable test --locked --release -p zakura-orchard
          --features verifier-fingerprint,circuit-fixtures
          --lib circuit::halo2::fingerprint::
      - name: Regenerate the Add and Mul circuit fixtures
        if: matrix.part == 'circuit fixtures'
        env:
          IRONWOOD_FIXTURE_OUT: ${{ runner.temp }}/ironwood-circuit-fixtures
        run: >-
          cargo +stable test --locked --release -p zakura-halo2-gadgets
          --lib ecc::chip::layout_dump::dump_ironwood_fixtures
          -- --exact --ignored
      - name: Regenerate the Orchard Action circuit fixtures
        if: matrix.part == 'circuit fixtures'
        env:
          IRONWOOD_ACTION_FIXTURE_OUT: ${{ runner.temp }}/ironwood-circuit-fixtures
        run: >-
          cargo +stable test --locked --release -p zakura-orchard
          --features verifier-fingerprint,circuit-fixtures
          --lib circuit::halo2::layout_dump::dump_ironwood_action_fixtures
          -- --exact --ignored
      - name: Compare all ten outputs with the pinned Ironwood fixtures
        if: matrix.part == 'circuit fixtures'
        working-directory: ${{ runner.temp }}/ironwood-circuit-fixtures
        run: sha256sum --check "$GITHUB_WORKSPACE/.github/fixtures/ironwood-circuits.sha256"
      - name: Verify working directory is clean
        run: git diff --exit-code

  orchard-fingerprint-check:
    name: orchard / Compile-check verifier fingerprint
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Compile-check verifier-fingerprint capture
        run: >-
          cargo +stable test -p zakura-orchard
          --features verifier-fingerprint
          --no-run
          --verbose
      - name: Verify working directory is clean
        run: git diff --exit-code

  orchard-prover-fingerprint:
    name: orchard / Test prover fingerprint (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each part needs its own release build of the feature set it tests,
        # so the parts run as parallel jobs instead of back to back.
        part: [halo2 recorder, pinned proofs, serial prover]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Test the observational recorder
        if: matrix.part == 'halo2 recorder'
        run: >-
          cargo +stable test --locked --release --lib
          -p zakura-halo2-proofs --features unstable-prover-fingerprint
          plonk::prover_fingerprint::
      - name: Test the public recorder API
        if: matrix.part == 'halo2 recorder'
        run: >-
          cargo +stable test --locked --release --test prover_fingerprint
          -p zakura-halo2-proofs --features unstable-prover-fingerprint
      - name: Check pinned prover proofs and RNG tapes without the verifier feature
        if: matrix.part == 'pinned proofs'
        env:
          RAYON_NUM_THREADS: '1'
        run: >-
          cargo +stable test --locked --release --lib
          -p zakura-orchard --features prover-fingerprint
          circuit::halo2::prover_fingerprint::
      - name: Test both fingerprint features together
        if: matrix.part == 'pinned proofs'
        env:
          RAYON_NUM_THREADS: '1'
        run: >-
          cargo +stable test --locked --release --lib
          -p zakura-orchard --features prover-fingerprint,verifier-fingerprint
          circuit::halo2::prover_fingerprint::
      - name: Test captures through the serial prover
        if: matrix.part == 'serial prover'
        run: >-
          cargo +stable test --locked --release --lib
          -p zakura-orchard --no-default-features --features backend-halo2 --features std,prover-fingerprint
          circuit::halo2::prover_fingerprint::
      - name: Verify working directory is clean
        run: git diff --exit-code

  halo2-multicore-test:
    name: halo2 / Test multicore multiexp on Linux
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run the multiexp tests with multicore
        # `halo2-test` runs with `--no-default-features`, which drops
        # `multicore`, so the parallel Pasta GLV multiscalar path
        # (`pasta_curves/multicore`) never runs there. Rather than repeat the
        # whole suite with one more feature, run only the multiexp tests —
        # including `test_multiexp_parallel_glv_matches_naive`, which installs
        # explicit one- and three-thread pools — with `multicore` enabled.
        run: >-
          cargo +stable test --verbose --release
          -p zakura-halo2-proofs
          --no-default-features
          --features batch,dev-graph,gadget-traces,multicore
          -- arithmetic::test_multiexp
      - name: Run the prepared commitment tests with multicore
        run: >-
          cargo +stable test --verbose --release
          -p zakura-halo2-proofs
          --no-default-features
          --features batch,dev-graph,gadget-traces,multicore
          -- prepared_

  sinsemilla-weighted-test:
    name: sinsemilla / Test weighted Merkle evaluator on Linux
    needs: changes
    if: needs.changes.outputs.sinsemilla == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run weighted Merkle evaluator tests
        run: >-
          cargo +stable test -p zakura-sinsemilla
          --lib
          --verbose
          -- weighted::tests

  orchard-platform-smoke:
    name: orchard / Platform smoke test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Compile tests
        run: cargo +stable test -p zakura-orchard --verbose --no-run
      - name: Create and verify a proof individually and in a batch
        run: cargo +stable test -p zakura-orchard --verbose --test platform_smoke
      - name: Run weighted Merkle vector tests on the Apple AArch64 assembly backend
        # The macOS runner is Apple silicon, the only place the
        # `pasta_curves/aarch64-asm` field backend is live. Linux already runs
        # the weighted-merkle lib tests on the portable backend; this re-runs
        # the Merkle fixed-vector tests (tree::tests) with the weighted
        # evaluator on top of the assembly field arithmetic, so both are
        # pinned to the same external bytes on real hardware.
        if: matrix.os == 'macOS-latest'
        run: >-
          cargo +stable test -p zakura-orchard
          --features weighted-merkle,aarch64-asm
          --lib
          --verbose
          -- tree::tests
      - name: Verify working directory is clean
        run: git diff --exit-code

  orchard-no-std:
    name: orchard / ${{ matrix.backend }} no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
          - thumbv7em-none-eabihf
        backend: [halo2, sensei]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          targets: ${{ matrix.target }}
      - name: Build no_std target
        run: >-
          cargo +1.97.0 build -p zakura-orchard
          --no-default-features --features backend-${{ matrix.backend }}
          --target ${{ matrix.target }}
          --verbose

  # zcash/pasta_curves .github/workflows/ci.yml @
  # bd896a571d34bceb3451a048a08cf21f78ef1942
  pasta-test:
    name: pasta_curves / Test on Linux (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: [--all-features, --no-default-features, --features=multicore]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Run tests
        run: >-
          cargo +stable test -p zakura-pasta-curves
          --verbose
          --release
          ${{ matrix.features }}
      - name: Test explicit x86-64 target features
        if: matrix.features == '--features=multicore'
        env:
          RUSTFLAGS: -C target-feature=+adx,+bmi2
        run: |
          if grep -qw adx /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo; then
            cargo +stable test -p zakura-pasta-curves \
              --verbose --release --features=multicore \
              --target x86_64-unknown-linux-gnu
          else
            echo "Runner lacks ADX/BMI2; compile assembly tests without running."
            cargo +stable test -p zakura-pasta-curves \
              --verbose --release --features=multicore --no-run \
              --target x86_64-unknown-linux-gnu
          fi
      - name: Verify working directory is clean
        run: git diff --exit-code

  pasta-platform-smoke:
    name: pasta_curves / Platform smoke test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Compile tests
        run: >-
          cargo +stable test -p zakura-pasta-curves
          --verbose
          --release
          --all-features
          --no-run
      - name: Test field arithmetic
        run: >-
          cargo +stable test -p zakura-pasta-curves
          --verbose
          --release
          --all-features
          test_inv
      # This is the only CI runner that executes the aarch64-asm backend; the
      # AArch64 Linux and bare-metal jobs only build, and the Linux test jobs
      # run the portable path. Run the whole suite so every assembly-backed
      # path, including deferred accumulation, meets its portable oracles.
      - name: Test Apple AArch64 assembly
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: >-
          cargo +stable test -p zakura-pasta-curves
          --verbose
          --release
          --all-features
      - name: Verify working directory is clean
        run: git diff --exit-code

  pasta-aarch64-linux-build:
    name: pasta_curves / Build AArch64 Linux assembly
    needs: changes
    if: >-
      needs.changes.outputs.pasta_curves == 'true' ||
      needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install AArch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compile and link Pasta tests
        run: >-
          cargo +stable test -p zakura-pasta-curves
          --target aarch64-unknown-linux-gnu
          --features aarch64-asm
          --release
          --no-run
          --verbose
      - name: Compile and link Halo 2 tests
        run: >-
          cargo +stable test -p zakura-halo2-proofs
          --target aarch64-unknown-linux-gnu
          --release
          --no-run
          --verbose
      - name: Verify ELF hardening metadata
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find target/aarch64-unknown-linux-gnu/release/build \
            -name libpasta_curves_aarch64.a -print -quit)"
          test -n "${archive_path}"
          aarch64-linux-gnu-readelf --notes "${archive_path}" \
            | grep -Eqi 'aarch64 feature:[[:space:]]*BTI[[:space:]]*$'
          aarch64-linux-gnu-readelf --sections --wide "${archive_path}" \
            | grep -q '[.]note.GNU-stack'

  pasta-aarch64-none-build:
    name: pasta_curves / Build bare-metal AArch64 assembly
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC_aarch64_unknown_none: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
        with:
          targets: aarch64-unknown-none
      - name: Install AArch64 assembler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Pasta with the assembly backend
        run: >-
          cargo +stable build -p zakura-pasta-curves
          --target aarch64-unknown-none
          --no-default-features
          --features aarch64-asm
          --release
          --verbose
      - name: Verify bare-metal assembly and ELF metadata
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(find target/aarch64-unknown-none/release/build \
            -name libpasta_curves_aarch64.a -print -quit)"
          test -n "${archive_path}"
          aarch64-linux-gnu-nm --defined-only "${archive_path}" \
            | grep -q pasta_curves_sqr_n_mul_mont_pasta
          aarch64-linux-gnu-readelf --notes "${archive_path}" \
            | grep -Eqi 'aarch64 feature:[[:space:]]*BTI[[:space:]]*$'
          aarch64-linux-gnu-readelf --sections --wide "${archive_path}" \
            | grep -q '[.]note.GNU-stack'

  pasta-test-32-bit:
    name: pasta_curves / Test i686 (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: [--all-features, --no-default-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          targets: i686-unknown-linux-gnu
      - name: Install cross-platform support dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run tests
        run: >-
          cargo +1.97.0 test -p zakura-pasta-curves
          --verbose
          --target i686-unknown-linux-gnu
          ${{ matrix.features }}
      - name: Verify working directory is clean
        run: git diff --exit-code

  pasta-no-std:
    name: pasta_curves / Build no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
