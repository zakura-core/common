  librustzcash-configurations:
    name: librustzcash subset / Configuration checks
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          components: clippy
      - name: Check node construction without wallet derivation
        run: >-
          cargo +1.97.0 check -p zakura-primitives --locked --lib
          --no-default-features --features backend-halo2,std,circuits,multicore
      - name: Test coinbase construction without wallet derivation
        run: >-
          cargo +1.97.0 test -p zakura-primitives --locked --lib
          --no-default-features --features backend-halo2,std,circuits,multicore
          transaction::builder::coinbase_tests
      - name: Check Sapling dummy notes without wallet derivation
        run: >-
          cargo +1.97.0 test -p zakura-sapling-crypto --locked --lib
          --no-default-features --features std,circuit,multicore
          dummy_note_derivation_and_randomness_are_unchanged
      - name: Test keys without indexed ZIP 32 addresses
        run: >-
          cargo +1.97.0 test -p zakura-keys --locked --lib
          --no-default-features
          --features backend-halo2,std,orchard,sapling,transparent-inputs,unstable,test-dependencies
      - name: Check no-default-features
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --no-default-features
          --features zakura-keys/backend-halo2,zakura-primitives/backend-halo2
      - name: Check transparent-inputs-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --no-default-features
          --features zakura-keys/backend-halo2,zakura-primitives/backend-halo2
          --features zakura-keys/transparent-inputs,zakura-primitives/transparent-inputs
      - name: Check transparent-key-encoding-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --no-default-features
          --features zakura-keys/backend-halo2,zakura-primitives/backend-halo2
          --features zakura-keys/transparent-key-encoding
      - name: Check Sapling-only
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --no-default-features
          --features zakura-keys/backend-halo2,zakura-primitives/backend-halo2
          --features zakura-keys/sapling,zakura-primitives/circuits
      - name: Check Orchard
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --no-default-features
          --features zakura-keys/backend-halo2,zakura-primitives/backend-halo2
          --features zakura-keys/orchard,zakura-primitives/circuits
      - name: Check all supported backend features
        if: ${{ !cancelled() }}
        run: >-
          cargo +1.97.0 check
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --features "$(python3 .github/scripts/supported_features.py zakura-address zakura-keys zakura-primitives zakura-protocol zakura-proofs zakura-transparent zakura-zip321)"
      - name: Clippy each feature of each imported crate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for package in zakura-keys zakura-primitives zakura-protocol zakura-proofs zakura-zip321; do
            cargo +1.97.0 metadata --no-deps --format-version 1 |
              jq -r --arg package "$package" \
                '.packages[] | select(.name == $package) | .features | keys[]' |
              while IFS= read -r feature; do
                selector=""
                case "$package" in
                  zakura-keys|zakura-primitives|zakura-proofs)
                    selector=backend-halo2
                    if [[ "$feature" == backend-* ]]; then selector="$feature"; fi
                    ;;
                esac
                cargo +1.97.0 clippy -p "$package" \
                  --no-deps \
                  --no-default-features \
                  --features "${selector:+$selector,}$feature"
              done
          done
      - name: Install beta Clippy
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dtolnay/rust-toolchain@482f49bd06e5fc9083e4fd71e1327793b1c839fe # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned beta; action uses orphan commits
        with:
          components: clippy
      - name: Clippy on beta
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          cargo +beta clippy
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --no-deps
          --features "$(python3 .github/scripts/supported_features.py zakura-address zakura-keys zakura-primitives zakura-protocol zakura-proofs zakura-transparent zakura-zip321)"
          --all-targets
          -- -W clippy::all

  librustzcash-no-std:
    name: librustzcash subset / Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            packages: -p zakura-proofs
            build-deps: gcc-multilib
          - target: thumbv7em-none-eabihf
            packages: -p zakura-address -p zakura-keys -p zakura-primitives -p zakura-protocol -p zakura-transparent
            build-deps: gcc-arm-none-eabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ca36e3307eb02aaffd8a9268ae90e586fd4f461e # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned 1.97.0; action uses orphan commits
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-platform support dependencies
        if: matrix.build-deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.build-deps }}
      - name: Build target
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGET: ${{ matrix.target }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          backend_args=()
          if [[ "$PACKAGES" == *zakura-primitives* ]]; then
            backend_args=(--features "zakura-keys/backend-halo2,zakura-primitives/backend-halo2")
          elif [[ "$PACKAGES" == *zakura-proofs* ]]; then
            backend_args=(--features "zakura-proofs/backend-halo2")
          fi
          cargo +1.97.0 build "${packages[@]}" "${backend_args[@]}" --no-default-features --target "$TARGET" --verbose

  sensei-features:
    name: Sensei / Features (${{ matrix.features || 'primitives only' }})
    needs: changes
    if: needs.changes.outputs.sensei == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "prover", "verifier", "prover,verifier,multicore,x86_64-asm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Check feature configuration
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy --locked -p zakura-sensei --all-targets --no-default-features --features "$FEATURES" -- -D warnings
      - name: Check documentation
        env:
          FEATURES: ${{ matrix.features }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p zakura-sensei --no-default-features --features "$FEATURES" --no-deps

  # Keep proof tests disabled alongside Udon's test suites. Build, lint, feature,
  # formatting, and documentation checks remain active. Restore
  # `if: needs.changes.outputs.sensei == 'true'` to enable this job.
  sensei-test:
    name: Sensei / Tests (${{ matrix.arch }}, ${{ matrix.features || 'default' }})
    needs: changes
    if: false # Temporarily disabled; see the note above `sensei-test`.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        features: ["", "portable"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PROPTEST_CASES: "32"
      RAYON_NUM_THREADS: "2"
      RUST_BACKTRACE: "1"
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Test shared definitions, generators, and macros
        run: |
          cargo test --release --locked -p zakura-sensei-shared
          cargo test --release --locked -p zakura-sensei-artifacts
          cargo test --release --locked -p zakura-sensei-macros
      - name: Test primitives, proving, and verification
        run: cargo test --release --locked -p zakura-sensei --features "$FEATURES"

  udon-features:
    needs: changes
    if: needs.changes.outputs.udon == 'true'
    defaults:
      run:
        shell: bash
    name: Udon / Feature checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Clippy without optional features
        run: cargo clippy -p zakura-udon --all-targets --no-default-features --locked -- -D warnings
      - name: Clippy with traits but without Poseidon
        run: cargo clippy -p zakura-udon --all-targets --no-default-features --features traits --locked -- -D warnings
      # `--all-features` enables `portable`, which hides the x86-64 assembly.
      - name: Clippy with x86-64 assembly
        run: cargo clippy -p zakura-udon --all-targets --no-default-features --features x86_64-asm,traits,poseidon --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked -p zakura-bento-core -p zakura-bento-macros -p zakura-bento -p zakura-udon --no-default-features --no-deps
          cargo doc --locked -p zakura-udon --no-default-features --features traits --no-deps
          cargo doc --locked -p zakura-udon --no-default-features --features poseidon --no-deps
          cargo doc --locked -p zakura-udon --no-default-features --features x86_64-asm --no-deps
          cargo doc --locked -p zakura-bento-core -p zakura-bento-macros -p zakura-bento -p zakura-udon --all-features --no-deps

  # The Udon and Bento test jobs below are temporarily disabled. Workspace-wide
  # dependency and Cargo.lock churn routes every such PR through them, and
  # their runtime dominates CI for changes that do not touch these crates. The
  # crates stay checked, linted, and documented by `rust-checks`, `formatting`,
  # and `udon-features`. Restore each job's
  # `if: needs.changes.outputs.udon == 'true'` gate to re-enable them.
  udon-test:
    needs: changes
    if: false # Temporarily disabled; see the note above `udon-test`.
    defaults:
      run:
        shell: bash
    name: Udon / Arithmetic (${{ matrix.arch }}, ${{ matrix.tables }}, ${{ matrix.suite }})
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        tables: [default, large]
        # Each suite runs as its own job so that no single Udon job sets the
        # CI critical path. The assembly suite is x86_64 only.
        suite: [release, debug-assertions, x86-64-asm]
        exclude:
          - arch: aarch64
            suite: x86-64-asm
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - tables: default
            native_features: "--no-default-features"
            trait_features: "--no-default-features --features traits,poseidon"
          - tables: large
            native_features: "--no-default-features --features sqrt-table-large"
            trait_features: "--all-features"
    env:
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          # The compile-test harnesses build generated consumer crates with
          # the ambient Cargo environment and assume default warning behavior.
          build-warnings: ""
      - name: Run release tests without traits
        if: matrix.suite == 'release'
        env:
          FEATURES: ${{ matrix.native_features }}
        run: |
          read -r -a features <<< "$FEATURES"
          cargo test --release --locked -p zakura-bento-core -p zakura-bento-macros -p zakura-bento -p zakura-udon "${features[@]}"
      - name: Run release tests with traits
        if: matrix.suite == 'release'
        env:
          FEATURES: ${{ matrix.trait_features }}
        run: |
          read -r -a features <<< "$FEATURES"
          cargo test --release --locked -p zakura-bento-core -p zakura-bento-macros -p zakura-bento -p zakura-udon "${features[@]}"
      - name: Check Udon with debug assertions without traits
        if: matrix.suite == 'debug-assertions'
        env:
          FEATURES: ${{ matrix.native_features }}
        run: |
          read -r -a features <<< "$FEATURES"
          cargo test --locked -p zakura-udon --lib "${features[@]}"
      - name: Check Udon with debug assertions with traits
        if: matrix.suite == 'debug-assertions'
        env:
          FEATURES: ${{ matrix.trait_features }}
        run: |
          read -r -a features <<< "$FEATURES"
          cargo test --locked -p zakura-udon --lib "${features[@]}"
      # `--all-features` enables `portable`, so the x86-64 assembly needs its
      # own runs: forced by the feature, then selected from target features.
      # A runner without ADX/BMI2 only compiles the assembly tests.
      - name: Test forced x86-64 assembly
        if: matrix.suite == 'x86-64-asm'
        env:
          FEATURES: ${{ matrix.native_features }}
        run: |
          read -r -a features <<< "$FEATURES"
          if grep -qw adx /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo; then
            cargo test --release --locked -p zakura-udon "${features[@]}" --features x86_64-asm
            cargo test --locked -p zakura-udon --lib "${features[@]}" --features x86_64-asm,traits,poseidon
          else
            echo "Runner lacks ADX/BMI2; compile assembly tests without running."
            cargo test --release --locked -p zakura-udon "${features[@]}" --features x86_64-asm --no-run
            cargo test --locked -p zakura-udon --lib "${features[@]}" --features x86_64-asm,traits,poseidon --no-run
          fi
      - name: Test x86-64 assembly selected by target features
        if: matrix.suite == 'x86-64-asm'
        env:
          FEATURES: ${{ matrix.native_features }}
          RUSTFLAGS: -C target-feature=+adx,+bmi2
        run: |
          read -r -a features <<< "$FEATURES"
          if grep -qw adx /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo; then
            cargo test --release --locked -p zakura-udon "${features[@]}" \
              --target x86_64-unknown-linux-gnu
          else
            echo "Runner lacks ADX/BMI2; compile assembly tests without running."
            cargo test --release --locked -p zakura-udon "${features[@]}" \
              --target x86_64-unknown-linux-gnu --no-run
          fi
      - name: Preserve property regressions
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: udon-regressions-${{ matrix.arch }}-${{ matrix.tables }}-${{ matrix.suite }}
          path: crates/udon/src/**/*.regressions
          if-no-files-found: ignore

  udon-consumers:
    needs: changes
    if: false # Temporarily disabled; see the note above `udon-test`.
    defaults:
      run:
        shell: bash
    name: Udon / Compiler and artifact consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          # The consumer harnesses build generated crates with the ambient
          # Cargo environment and assume default warning behavior.
          build-warnings: ""
      - name: Run Udon compiler and artifact consumers
        # Each consumer selects its own dependency feature matrix.
        run: |
          cargo test --release --locked -p zakura-udon \
            --test api --test field --test curve --test fft -- --ignored | tee "$RUNNER_TEMP/consumers.log"
          # Require a completed nonempty run, and reject any empty target.
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/consumers.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/consumers.log"

  udon-benchmarks:
    needs: changes
    if: false # Temporarily disabled; see the note above `udon-test`.
    defaults:
      run:
        shell: bash
    name: Udon / Benchmark smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Exercise field benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench field --features traits -- --test
          cargo bench --locked -p zakura-udon --bench field --features traits,sqrt-table-large -- --test
      - name: Exercise FFT benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench fft --features traits -- --test
          cargo bench --locked -p zakura-udon --bench fft_strategies -- --test
      - name: Exercise curve benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench curve -- --test
          cargo bench --locked -p zakura-udon --bench curve --features sqrt-table-large -- --test
          cargo bench --locked -p zakura-udon --bench msm -- --test
      - name: Exercise incremental execution benchmarks
        run: cargo bench --locked -p zakura-udon --bench execution -- --test

  udon-miri:
    needs: changes
    if: false # Temporarily disabled; see the note above `udon-test`.
    defaults:
      run:
        shell: bash
    name: Udon / Unsafe storage checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MIRI_TOOLCHAIN: nightly-2026-09-06
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Miri toolchain
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src
      - name: Check core storage
        run: |
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-bento-core --lib pod:: | tee "$RUNNER_TEMP/core.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/core.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/core.log"
      - name: Check public storage API
        run: |
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-bento --test pod storage:: | tee "$RUNNER_TEMP/pod.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/pod.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/pod.log"
      - name: Check field and affine point storage
        run: |
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-udon --test field --test curve pod:: | tee "$RUNNER_TEMP/udon-pod.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/udon-pod.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/udon-pod.log"
      - name: Check transparent consumer views
        run: |
          cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-udon --lib --features poseidon transparent_views | tee "$RUNNER_TEMP/udon-views.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/udon-views.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/udon-views.log"

  udon-portability:
    needs: changes
    if: false # Temporarily disabled; see the note above `udon-test`.
    defaults:
      run:
        shell: bash
    name: Udon / Target portability contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROPTEST_CASES: "32"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          # The portability harness builds generated crates with the ambient
          # Cargo environment and assumes default warning behavior.
          build-warnings: ""
      - name: Install target libraries
        run: rustup target add thumbv7em-none-eabi s390x-unknown-linux-gnu
      - name: Build portable libraries and check unsupported layouts
        run: |
          cargo test --release --locked -p zakura-bento --test api portability:: -- --ignored | tee "$RUNNER_TEMP/portability.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/portability.log"
          ! grep -Eq '^test result: ok\. 0 passed;' "$RUNNER_TEMP/portability.log"

  test-success:
    name: test success
    if: always()
    needs:
      - changes
      - rust-checks
      - formatting
      - docs-build
      - halo2-test
      - halo2-multicore-test
      - halo2-platform-smoke
      - halo2-test-32-bit
      - halo2-build
      - orchard-test
      - orchard-weighted-test
      - orchard-fingerprint-check
      - orchard-prover-fingerprint
      - ironwood-fixtures
      - orchard-platform-smoke
      - orchard-no-std
      - orchard-backends
      - pasta-test
      - pasta-platform-smoke
      - pasta-aarch64-linux-build
      - pasta-aarch64-none-build
      - pasta-test-32-bit
      - pasta-no-std
      - reddsa-test
      - reddsa-no-std
      - redjubjub-test
      - redjubjub-no-std
      - sapling-test
      - sapling-platform-smoke
      - sapling-no-std
      - sinsemilla-weighted-test
      - equihash-test
      - librustzcash-test
      - librustzcash-configurations
      - librustzcash-no-std
      - sensei-features
      - sensei-test
      - udon-features
      - udon-test
      - udon-consumers
      - udon-benchmarks
      - udon-miri
      - udon-portability
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # Every job except the detector is path-gated. A skipped job is valid,
          # but a failed or cancelled job must still fail this aggregate status.
          allowed-skips: >-
            rust-checks,
            formatting,
            docs-build,
            halo2-test,
            halo2-multicore-test,
            halo2-platform-smoke,
            halo2-test-32-bit,
            halo2-build,
            orchard-test,
            orchard-weighted-test,
            orchard-fingerprint-check,
            orchard-prover-fingerprint,
            ironwood-fixtures,
            orchard-platform-smoke,
            orchard-no-std,
            orchard-backends,
            pasta-test,
            pasta-platform-smoke,
            pasta-aarch64-linux-build,
            pasta-aarch64-none-build,
            pasta-test-32-bit,
            pasta-no-std,
            reddsa-test,
            reddsa-no-std,
            redjubjub-test,
            redjubjub-no-std,
            sapling-test,
            sapling-platform-smoke,
            sapling-no-std,
            sinsemilla-weighted-test,
            equihash-test,
            librustzcash-test,
            librustzcash-configurations,
            librustzcash-no-std,
            sensei-features,
            sensei-test,
            udon-features,
            udon-test,
            udon-consumers,
            udon-benchmarks,
            udon-miri,
            udon-portability

  orchard-backends:
    name: Orchard / Capabilities and proof compatibility
    needs: changes
    if: needs.changes.outputs.orchard == 'true' || needs.changes.outputs.reddsa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "16"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - run: cargo fetch --locked
      - run: python3 .github/scripts/test_supported_features.py
      - run: python3 .github/scripts/check_native_backend.py
      - run: python3 .github/scripts/check_orchard_backends.py
      - run: cargo test --release --locked -p zakura-orchard --features test-dependencies
      - run: cargo test --release --locked -p zakura-orchard --no-default-features --features backend-sensei,circuit,multicore,zip32-addresses,test-dependencies,weighted-merkle
      - run: cargo test --release --locked -p zakura-reddsa -p zakura-reddsa-frost --no-default-features --features pallas-sensei,std
