name: Maintenance

# Expensive and dependency-drift checks stay off the pull-request critical
# path. API documentation is built by ci.yml's docs-build job.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  orchard-latest:
    name: orchard / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        run: cargo +stable build -p zakura-orchard --all-features --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  sapling-latest:
    name: sapling-crypto / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        run: >-
          cargo +stable build -p zakura-sapling-crypto
          --all-targets
          --all-features
          --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  librustzcash-latest:
    name: librustzcash subset / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        run: >-
          cargo +stable build
          -p zakura-history
          -p zakura-keys
          -p zakura-primitives
          -p zakura-proofs
          --all-targets
          --all-features
          --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  reddsa-latest:
    name: reddsa / Nightly with latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - name: Update dependencies
        run: cargo +nightly update --verbose
      - name: Run tests
        run: cargo +nightly test -p zakura-reddsa --all-features

  redjubjub-nightly:
    name: redjubjub / Test on nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - run: cargo +nightly test -p zakura-redjubjub --all-features
