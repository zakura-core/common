name: Maintenance

# Expensive and dependency-drift checks stay off the pull-request critical
# path. API documentation is built by ci.yml's docs-build job.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  orchard-latest:
    name: orchard / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Install build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Enumerate supported features
        # --all-features cannot represent the mutually exclusive backend
        # selectors; enumerate the supported set before dropping the lockfile.
        shell: bash
        run: >-
          echo "ORCHARD_FEATURES=$(python3 .github/scripts/supported_features.py zakura-orchard)"
          >> "$GITHUB_ENV"
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        shell: bash
        run: cargo +stable build -p zakura-orchard --features "$ORCHARD_FEATURES" --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  sapling-latest:
    name: sapling-crypto / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        run: >-
          cargo +stable build -p zakura-sapling-crypto
          --all-targets
          --all-features
          --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  librustzcash-latest:
    name: librustzcash subset / Latest dependencies on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned stable; action uses orphan commits
      - name: Enumerate supported features
        # --all-features would activate both Orchard backend selectors through
        # the zakura-keys and zakura-primitives forwards.
        shell: bash
        run: >-
          echo "LIBRUSTZCASH_FEATURES=$(python3 .github/scripts/supported_features.py
          zakura-equihash zakura-address zakura-keys zakura-primitives
          zakura-protocol zakura-proofs zakura-transparent zakura-zip321)"
          >> "$GITHUB_ENV"
      - name: Remove lockfile
        run: rm Cargo.lock
      - name: Build with latest dependencies
        shell: bash
        run: >-
          cargo +stable build
          -p zakura-equihash
          -p zakura-address
          -p zakura-keys
          -p zakura-primitives
          -p zakura-protocol
          -p zakura-proofs
          -p zakura-transparent
          -p zakura-zip321
          --all-targets
          --features "$LIBRUSTZCASH_FEATURES"
          --verbose
      - name: Verify working directory is clean except for the lockfile
        run: git diff --exit-code ':!Cargo.lock'

  reddsa-latest:
    name: reddsa / Nightly with latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned nightly; action uses orphan commits
      - name: Enumerate supported features
        # --all-features would select both mutually exclusive Pallas backends.
        run: >-
          echo "REDDSA_FEATURES=$(python3 .github/scripts/supported_features.py
          zakura-reddsa zakura-reddsa-frost)"
          >> "$GITHUB_ENV"
      - name: Update dependencies
        run: cargo +nightly update --verbose
      - name: Run tests
        run: cargo +nightly test -p zakura-reddsa -p zakura-reddsa-frost --features "$REDDSA_FEATURES"

  redjubjub-nightly:
    name: redjubjub / Test on nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # zizmor: ignore[impostor-commit,ref-version-mismatch] -- pinned nightly; action uses orphan commits
      - run: cargo +nightly test -p zakura-redjubjub --all-features
