# Lychee link checker configuration for Zakura libraries.
# https://github.com/lycheeverse/lychee

exclude = [
    "^https://github.com/.*/compare/",
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "^https?://0\\.0\\.0\\.0",
    "^https?://example\\.com",
    "^https://crates\\.io/crates/",
    "^https://github.com/.*/settings",
    "^https://github.com/organizations/.*/settings",
    "^https://github.com/.*/runs/",
    "^https://eprint\\.iacr\\.org/",
    "^https://zips\\.z\\.cash/",
    "^https://electriccoin\\.co/",
]

exclude_path = [
    "node_modules",
    "target",
    ".git",
    "supply-chain",
    "sapling-crypto/supply-chain",
]

accept = ["200", "202", "204", "206", "301", "302", "307", "308", "429"]
timeout = 30
exclude_private = true
exclude_link_local = true
exclude_loopback = true
cache = true
max_cache_age = "7d"
max_concurrency = 8
user_agent = "lychee/0.24 (Zakura libraries link checker; https://github.com/zakura-core/libraries)"
include_mail = false
max_retries = 3
retry_wait_time = 10
