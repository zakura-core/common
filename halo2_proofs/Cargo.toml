[package]
edition = "2021"
rust-version = "1.88"
name = "zakura-halo2-proofs"
version = "1.0.0-rc.1"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Fast PLONK-based zero-knowledge proving system with no trusted setup
"""
documentation = "https://docs.rs/zakura-halo2-proofs"
readme = "README.md"
keywords = [
    "halo",
    "proofs",
    "zkp",
    "zkSNARKs",
]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/libraries"
