[package]
name = "zakura-pasta-curves"
description = "Implementation of the Pallas and Vesta (Pasta) curve cycle"
keywords = ["cryptography", "pallas", "vesta", "elliptic-curve", "zcash"]
categories = ["cryptography"]
exclude = ["/sage"]
build = "build.rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "pasta_curves"

[dependencies]
blake2b_simd = { version = "1", optional = true, default-features = false }
ec-gpu = { version = "0.2.0", optional = true }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
hex = { version = "0.4", features = ["alloc", "serde"], optional = true, default-features = false }
maybe-rayon = { version = "0.1.0", optional = true, default-features = false }
once_cell = { version = "1", features = ["race", "alloc"], optional = true, default-features = false }
rand = { version = "0.10", default-features = false }
serde_crate = { version = "1.0.16", features = ["alloc"], optional = true, default-features = false, package = "serde" }
static_assertions = "1.1.0"
subtle = { version = "2.3", default-features = false }

[build-dependencies]
cc = { version = "1.0.83", optional = true }

[dev-dependencies]
bincode = "1.3"
criterion = "0.4"
proptest = { version = "1", features = ["std"], default-features = false }
rand_xorshift = "0.5"
serde_json = "1.0"

[features]
aarch64-asm = ["dep:cc"]
alloc = ["group/alloc", "blake2b_simd"]
bits = ["ff/bits"]
default = ["bits", "sqrt-table"]
deferred = []
glv = ["alloc"]
# Batched AVX-512 IFMA slice arithmetic (x86_64 only; requires std for
# runtime CPU feature detection).
ifma = []
gpu = ["alloc", "ec-gpu"]
# Parallel evaluation of the GLV multiscalar windows and affine batches in
# `glv.rs` through the Rayon pool; implies `glv` (and therefore `alloc`).
multicore = ["glv", "dep:maybe-rayon", "maybe-rayon/threads"]
# The Eisenstein-orbit MSM backend (`glv::orbit`, planned against the
# Signed-Booth backend per input) and public prepared zero-check module
# (`glv::zero`). Without it arbitrary-scalar MSMs plan only the Signed-Booth
# backend; multicore callers can still use the private prepared evaluator
# through `CurveExt::try_prepare_zero_check`.
orbits = ["glv"]
repr-c = []
serde = ["hex", "serde_crate"]
sqrt-table = ["alloc", "dep:once_cell"]
uninline-portable = []

[[bench]]
name = "fp"
harness = false

[[bench]]
name = "fq"
harness = false

[[bench]]
name = "deferred"
harness = false
required-features = ["deferred"]

[[bench]]
name = "glv"
harness = false
required-features = ["glv"]

[[bench]]
name = "glv_table"
harness = false
required-features = ["glv"]

[[bench]]
name = "hashtocurve"
harness = false
required-features = ["alloc"]

[[bench]]
name = "point"
harness = false
required-features = ["alloc"]
