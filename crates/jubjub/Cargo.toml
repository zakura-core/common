[package]
name = "zakura-jubjub"
description = "Implementation of the Jubjub elliptic curve group"
keywords = ["cryptography", "jubjub", "elliptic-curve", "zcash"]
categories = ["cryptography"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "jubjub"

[dependencies]
bitvec = { version = "1", default-features = false }
bls12_381 = { workspace = true }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
rand_core = { version = "0.10", default-features = false }
subtle = { version = "^2.2.1", default-features = false }

[dev-dependencies]
criterion = "0.3"
rand_xorshift = { version = "0.5", default-features = false }

[features]
alloc = ["ff/alloc", "group/alloc"]
bits = ["ff/bits"]
default = ["alloc", "bits"]

[[bench]]
name = "fq_bench"
harness = false

[[bench]]
name = "fr_bench"
harness = false

[[bench]]
name = "point_bench"
harness = false
