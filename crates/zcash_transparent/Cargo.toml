[package]
name = "zakura-transparent"
description = "Rust implementations of the Zcash transparent protocol"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash"]

[lib]
name = "zcash_transparent"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
zcash_address.workspace = true
zcash_protocol.workspace = true
zip32 = { version = "0.2", default-features = false, optional = true }
corez = { version = "0.1.1", features = ["alloc"], default-features = false }
subtle = { version = "2.2.3", default-features = false }
zcash_spec = "0.2"
proptest = { version = ">=1,<1.7", optional = true }
bip32 = { version = "0.6", features = ["alloc"], optional = true, default-features = false }
secp256k1 = { version = "0.33", features = ["alloc"], optional = true, default-features = false }
zcash_script.workspace = true
getset = "0.1"
nonempty = { version = "0.11", default-features = false }
sha2 = { version = "0.10", default-features = false }
bs58 = { version = "0.5", features = ["alloc", "check"], default-features = false }
hex = { version = "0.4", features = ["alloc"], default-features = false }
ripemd = { version = "0.1", default-features = false }
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, features = ["zeroize"], optional = true }

[dev-dependencies]
secp256k1 = { version = "0.33", default-features = false, features = ["alloc"] }
proptest = ">=1,<1.7"
zcash_script = { workspace = true, features = ["signature-validation"] }
zcash_protocol = { workspace = true, features = ["test-dependencies"] }

[features]
pq = ["dep:slh-dsa", "zcash_script/pq", "zcash_script/signature-validation"]
# Wallet key derivation and spending transaction construction, enabled by default.
wallet = ["dep:zip32"]
default = ["wallet", "std", "pczt"]
std = [
    "secp256k1?/std",
    "zcash_address/std",
    "zcash_script/std",
]
# BIP 32 interoperability: conversions between this crate's key scopes and child
# indices and `bip32::ChildNumber`.
bip32 = ["dep:bip32", "wallet"]
# Partially created transparent bundles (`pczt` module and
# `builder::TransparentBuilder::build_for_pczt`), whose key derivation paths are BIP 32 paths.
pczt = ["bip32"]
# Spending transparent inputs: HD key derivation, signing, and ZIP 48 multisig
# descriptors. Also enables `pczt`, which carries the PCZT Signer role.
transparent-inputs = [
    "pczt",
    "bip32?/secp256k1-ffi",
    "dep:secp256k1",
    "zcash_script/descriptor",
]
test-dependencies = [
    "wallet",
    "dep:proptest",
    "zcash_protocol/test-dependencies",
]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(tokio_unstable)",
    'cfg(zcash_unstable, values("nu7"))',
    "cfg(live_network_tests)",
]
