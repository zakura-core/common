[package]
name = "zakura-keys"
description = "Zcash key and address management"
keywords = ["cryptography", "keys", "addresses", "zcash"]
categories = ["cryptography::cryptocurrencies"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "zcash_keys"

[dependencies]
bech32 = { version = "0.11", features = ["alloc"], default-features = false }
bip0039 = { version = "0.12", features = ["std"], optional = true, default-features = false }
bip32 = { version = "0.6", features = ["alloc"], optional = true, default-features = false }
bs58 = { version = "0.5", features = ["alloc", "check"], default-features = false }
byteorder = { version = "1", optional = true }
corez = { version = "0.1.1", features = ["alloc"], default-features = false, optional = true }
nonempty = { version = "0.11", default-features = false }
orchard = { workspace = true, optional = true }
proptest = { version = ">=1,<1.7", optional = true }
regex = { version = "1.11", optional = true, default-features = false }
sapling = { workspace = true, optional = true }
secp256k1 = { version = "0.33", features = ["alloc"], optional = true, default-features = false }
secrecy = "0.8"
transparent.workspace = true
zcash_address.workspace = true
zcash_protocol.workspace = true
zip32 = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
assert_matches = "1.5"
group = "0.14"
hex = { version = "0.4", features = ["alloc"], default-features = false }
orchard = { workspace = true, features = ["circuit"] }
proptest = ">=1,<1.7"
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
secp256k1 = { version = "0.33", features = ["alloc"], default-features = false }
subtle = { version = "2.2.3", default-features = false }
transparent = { workspace = true, features = ["test-dependencies"] }
zcash_address = { workspace = true, features = ["test-dependencies"] }
zcash_script = { version = "0.6", default-features = false }

[features]
# Dynamic memory accounting, enabled by default for existing clients.
memory-usage = ["orchard?/memory-usage", "sapling?/memory-usage", "transparent/memory-usage", "zcash_address/memory-usage", "zcash_protocol/memory-usage"]
# Wallet key derivation and ZIP 32 interoperability, enabled by default.
zip32 = ["dep:zip32", "orchard?/zip32", "sapling?/zip32", "transparent/zip32"]
# I/O traits for builds without the standard library. Standard builds use std::io.
no-std-io = ["dep:corez", "orchard?/no-std-io", "sapling?/no-std-io", "transparent/no-std-io", "zcash_address/no-std-io", "zcash_protocol/no-std-io"]
# Indexed ZIP 32 addresses and diversifier-index recovery, enabled by default.
zip32-addresses = ["zip32", "orchard?/zip32-addresses", "sapling?/zip32-addresses"]
default = ["memory-usage", "zip32", "std", "zip32-addresses"]
orchard = ["dep:orchard", "zip32"]
sapling = ["dep:sapling", "zip32"]
std = [
    "orchard?/std",
    "sapling?/std",
    "transparent/std",
    "zcash_address/std",
]
test-dependencies = [
    "zip32",
    "dep:proptest",
    "orchard?/test-dependencies",
    "sapling?/test-dependencies",
    "transparent/test-dependencies",
]
transparent-inputs = ["zip32", "dep:bip32", "transparent/transparent-inputs"]
transparent-key-encoding = ["dep:bip32", "dep:secp256k1"]
unstable = ["dep:byteorder"]
unstable-frost = ["orchard"]
zcashd-compat = ["dep:bip0039", "dep:regex"]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(tokio_unstable)",
    'cfg(zcash_unstable, values("nu7"))',
    "cfg(live_network_tests)",
]
