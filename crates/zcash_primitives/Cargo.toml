[package]
name = "zakura-primitives"
description = "Rust implementations of the Zcash primitives"
keywords = ["cryptography", "primitives", "transactions", "zcash"]
categories = ["cryptography::cryptocurrencies"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "zcash_primitives"
bench = false

[dependencies]
blake2b_simd = { version = "1", default-features = false }
corez = { version = "0.1.1", features = ["alloc"], default-features = false, optional = true }
equihash.workspace = true
ff = { version = "0.14", default-features = false }
hex = { version = "0.4", features = ["alloc"], default-features = false }
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"], default-features = false }
jubjub = { workspace = true, features = ["default"] }
memuse = { version = "0.2.2", default-features = false, optional = true }
nonempty = { version = "0.11", default-features = false }
orchard = { workspace = true }
proptest = { version = ">=1,<1.7", optional = true }
rand_core = { version = "0.10", default-features = false }
redjubjub = { workspace = true }
sapling = { workspace = true }
secp256k1 = { version = "0.33", features = ["alloc"], optional = true, default-features = false }
sha2 = { version = "0.10", default-features = false }
transparent.workspace = true
zcash_note_encryption = { workspace = true, features = ["alloc", "pre-zip-212"] }
zcash_protocol.workspace = true
zcash_script = { version = "0.6", default-features = false }

[dev-dependencies]
assert_matches = "1.5"
bls12_381 = { workspace = true, features = ["default"] }
criterion = "0.5"
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api", "test-dependencies"], default-features = false }
orchard = { workspace = true, features = ["test-dependencies", "zip32-addresses"] }
proptest = ">=1,<1.7"
rand = "0.10"
sapling = { workspace = true, features = ["test-dependencies", "zip32-addresses"] }
transparent = { workspace = true, features = ["test-dependencies"] }
zcash_protocol = { workspace = true, features = ["local-consensus", "test-dependencies"] }
zip32 = { version = "0.2", default-features = false }

[target."cfg(unix)".dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[features]
# Dynamic memory accounting, enabled by default for existing clients.
memory-usage = ["dep:memuse", "orchard/memory-usage", "sapling/memory-usage", "zcash_protocol/memory-usage"]
# Wallet transaction construction with ZIP 32 spending keys.
zip32 = ["sapling/zip32", "orchard/zip32", "transparent/zip32"]
# I/O traits for builds without the standard library. Standard builds use std::io.
no-std-io = ["dep:corez", "equihash/no-std-io", "orchard/no-std-io", "sapling/no-std-io", "transparent/no-std-io", "zcash_protocol/no-std-io"]
circuits = ["std", "orchard/circuit", "sapling/circuit"]
default = ["memory-usage", "zip32", "multicore", "std", "circuits", "pczt"]
# Retained for compatibility with the former optional documentation dependency.
document-features = []
expensive-tests = []
multicore = ["orchard/multicore", "sapling/multicore"]
no-expensive-tests = []
non-standard-fees = []
# PCZT construction (`DeferredPcztBuilder`, `Builder::build_for_pczt`, and their
# result types). Enabled by default; also enabled by `transparent-inputs`.
pczt = ["zip32", "transparent/pczt"]
std = [
    "document-features",
    "equihash/std",
    "redjubjub/std",
    "sapling/std",
    "orchard/std",
    "transparent/std",
]
temporary-zcashd = []
test-dependencies = [
    "zip32",
    "dep:proptest",
    "incrementalmerkletree/test-dependencies",
    "orchard/test-dependencies",
    "sapling/test-dependencies",
    "transparent/test-dependencies",
    "zcash_protocol/test-dependencies",
]
transparent-inputs = ["pczt", "transparent/transparent-inputs", "dep:secp256k1"]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(tokio_unstable)",
    'cfg(zcash_unstable, values("nu7"))',
    "cfg(live_network_tests)",
]

[[bench]]
name = "note_decryption"
harness = false
required-features = ["circuits", "zip32"]
