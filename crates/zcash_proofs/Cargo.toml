[package]
name = "zakura-proofs"
description = "Zcash zk-SNARK circuits and proving APIs"
keywords = ["cryptography", "zero-knowledge", "zksnarks", "zcash"]
categories = ["cryptography::cryptocurrencies"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "zcash_proofs"
bench = false

[dependencies]
bellman = { workspace = true, features = ["groth16"] }
blake2b_simd = { version = "1", default-features = false }
bls12_381 = { workspace = true, features = ["default"] }
group = "0.14"
home = { version = "0.5", optional = true }
jubjub = { workspace = true, features = ["default"] }
known-folders = { version = "1", optional = true }
minreq = { version = "2", features = ["https"], optional = true }
rand = { version = "0.10", features = ["sys_rng"], default-features = false }
rand_core = { version = "0.10", default-features = false }
sapling = { workspace = true }
wagyu-zcash-parameters = { version = "0.2", optional = true }
xdg = { version = "3", optional = true }
zcash_primitives = { workspace = true, features = ["circuits"] }

[dev-dependencies]
byteorder = "1"

[features]
bundled-prover = ["dep:wagyu-zcash-parameters"]
default = ["multicore"]
directories = ["dep:home", "dep:known-folders", "dep:xdg"]
download-params = ["dep:minreq", "directories"]
expensive-tests = []
local-prover = ["directories"]
multicore = ["bellman/multicore", "zcash_primitives/multicore"]
no-expensive-tests = []

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(tokio_unstable)",
    'cfg(zcash_unstable, values("nu7"))',
    "cfg(live_network_tests)",
]
