[package]
name = "zakura-halo2-proofs"
description = "Fast PLONK-based zero-knowledge proving system with no trusted setup"
keywords = ["cryptography", "halo2", "zero-knowledge", "zkp", "zksnarks"]
categories = ["cryptography"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "halo2_proofs"
bench = false

[dependencies]
backtrace = { version = "0.3", optional = true }
blake2b_simd = "1"
ff = "0.14"
group = "0.14"
halo2_legacy_pdqsort = { workspace = true, optional = true }
maybe-rayon = { version = "0.1.0", default-features = false }
pasta_curves = { workspace = true, features = ["default", "deferred", "glv", "ifma"] }
plotters = { version = "0.3.0", optional = true, default-features = false }
rand = { version = "0.10", features = ["sys_rng"], optional = true, default-features = false }
rand_core = { version = "0.10", default-features = false }
tabbycat = { version = "0.1", features = ["attributes"], optional = true }
tracing = "0.1"

[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
pasta_curves = { workspace = true, features = ["default", "aarch64-asm"] }

[dev-dependencies]
assert_matches = "1.5"
criterion = "0.3"
dashmap = ">=5, <5.5.0"
gumdrop = "0.8"
image = ">=0.24, <0.24.5"
proptest = "1"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"], default-features = false }
rand_core = { version = "0.10", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
batch = ["dep:rand"]
beta = []
default = ["batch", "multicore"]
dev-graph = ["plotters", "tabbycat"]
floor-planner-v1-legacy-pdqsort = ["halo2_legacy_pdqsort"]
gadget-traces = ["backtrace"]
multicore = ["maybe-rayon/threads", "pasta_curves/multicore"]
nightly = ["beta", "unstable-verifier-fingerprint"]
# The Eisenstein-orbit MSM backend and the prepared fixed-base zero-check
# (`Params::prepare_zero_checks`, routed through `MSM::eval`). Opt-in
# (default-off); without it halo2 keeps the Signed-Booth-only planner and
# the plain final identity test.
orbits = ["pasta_curves/orbits"]
sanity-checks = []
test-dev-graph = [
    "dev-graph",
    "plotters/bitmap_backend",
    "plotters/bitmap_encoder",
    "plotters/ttf",
]
unstable-verifier-fingerprint = []

[[example]]
name = "circuit-layout"
required-features = ["test-dev-graph"]

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "dev_lookup"
harness = false

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "hashtocurve"
harness = false

[[bench]]
name = "ipa"
harness = false

[[bench]]
name = "msm"
harness = false

[[bench]]
name = "plonk"
harness = false

[[bench]]
name = "plonk_verifier"
harness = false
