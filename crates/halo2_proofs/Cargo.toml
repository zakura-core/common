[package]
name = "zakura-halo2-proofs"
description = "Fast PLONK-based zero-knowledge proving system with no trusted setup"
keywords = ["cryptography", "halo2", "zero-knowledge", "zkp", "zksnarks"]
categories = ["cryptography"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "halo2_proofs"
bench = false

[dependencies]
backtrace = { version = "0.3", optional = true }
blake2b_simd = "1"
ff = "0.14"
group = "0.14"
maybe-rayon = { version = "0.1.0", default-features = false }
pasta_curves = { workspace = true, features = ["default", "deferred", "glv", "ifma"] }
plotters = { version = "0.3.0", optional = true, default-features = false }
rand = { version = "0.10", features = ["sys_rng"], optional = true, default-features = false }
rand_core = { version = "0.10", default-features = false }
tracing = "0.1"

[target.'cfg(all(target_arch = "aarch64", target_family = "unix"))'.dependencies]
pasta_curves = { workspace = true, features = ["default", "aarch64-asm"] }

[dev-dependencies]
assert_matches = "1.5"
clap = { version = "4", default-features = false, features = ["error-context", "help", "std", "usage"] }
criterion = "0.5"
image = ">=0.24, <0.24.5"
proptest = "1"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"], default-features = false }
rand_core = { version = "0.10", default-features = false }

[features]
batch = ["dep:rand"]
beta = []
default = ["batch", "multicore"]
dev-graph = ["plotters", "tabbycat"]
gadget-traces = ["backtrace"]
multicore = ["maybe-rayon/threads", "pasta_curves/multicore"]
nightly = ["beta", "unstable-verifier-fingerprint"]
# The Eisenstein-orbit MSM backend and the prepared fixed-base zero-check
# (`Params::prepare_zero_checks`, routed through `MSM::eval`). Opt-in
# (default-off); without it halo2 keeps the Signed-Booth-only planner and
# the plain final identity test.
orbits = ["pasta_curves/orbits"]
# Disable automatic x86-64 assembly selection in `pasta_curves`.
portable = ["pasta_curves/portable"]
sanity-checks = []
# Preserve the former optional-dependency feature for existing consumers.
# DOT rendering no longer needs the tabbycat crate.
tabbycat = []
test-dev-graph = [
    "dev-graph",
    "plotters/bitmap_backend",
    "plotters/bitmap_encoder",
    "plotters/ttf",
]
unstable-verifier-fingerprint = []
x86_64-asm = ["pasta_curves/x86_64-asm"]

# Capture complete selected prover executions for Rust/Lean correspondence fixtures.
unstable-prover-fingerprint = []

# Capture-only circuit and key-generation layout exporters.
unstable-circuit-fixtures = []

[[example]]
name = "circuit-layout"
required-features = ["test-dev-graph"]

# Run the cost model's argument parsing tests as part of the crate's tests.
[[example]]
name = "cost-model"
test = true

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "dev_lookup"
harness = false

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "hashtocurve"
harness = false

[[bench]]
name = "ipa"
harness = false

[[bench]]
name = "msm"
harness = false

[[bench]]
name = "plonk"
harness = false

[[bench]]
name = "plonk_verifier"
harness = false
