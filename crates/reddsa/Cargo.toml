[package]
name = "zakura-reddsa"
description = "A standalone implementation of the RedDSA signature scheme"
keywords = ["cryptography", "signatures", "reddsa", "zcash"]
categories = ["cryptography", "no-std"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["pallas-pasta"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "reddsa"

[dependencies]
blake2b_simd = { version = "1", default-features = false }
group = { version = "0.14", default-features = false }
hex = { version = "0.4", features = ["alloc"], optional = true, default-features = false }
jubjub = { workspace = true }
sensei = { workspace = true, optional = true }
pasta_curves = { workspace = true, optional = true, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
zeroize = { version = "1", optional = true, default-features = false }

[dev-dependencies]
bincode = "1"
criterion = "0.6"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
proptest = "1.6"
rand = "0.10"
rand_chacha = "0.10"

[features]
pallas-pasta = ["dep:pasta_curves"]
pallas-sensei = ["dep:sensei"]
alloc = ["hex", "jubjub/alloc"]
default = ["std", "pallas-pasta"]
nightly = []
# Retained for compatibility with the former unused optional dependencies.
thiserror = []
zeroize = []
serde = ["dep:serde"]
# Implements `zeroize::Zeroize` for `SigningKey`. Separate from the inert
# `zeroize` feature above, which `std` enables.
zeroize-signing-key = ["dep:zeroize", "jubjub/zeroize", "pasta_curves?/zeroize"]
std = [
    "blake2b_simd/std",
    "thiserror",
    "zeroize",
    "alloc",
    "serde",
]

[[bench]]
name = "bench"
harness = false
