[package]
name = "zakura-history"
description = "Library for Zcash blockchain history tools"
keywords = ["blockchain", "history", "zcash"]
categories = ["cryptography::cryptocurrencies"]
version = "1.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dev-dependencies]
assert_matches = "1.5"
proptest = ">=1,<1.7"

[dependencies]
primitive-types = { version = "0.12", default-features = false }
blake2b_simd = { version = "1", default-features = false }
corez = { version = "0.1.1", features = ["alloc"], default-features = false }
zcash_encoding = { version = "0.5", default-features = false }
proptest = { version = ">=1,<1.7", optional = true }

[features]
default = ["std"]
std = ["corez/std", "zcash_encoding/std"]
test-dependencies = ["dep:proptest"]

[lib]
name = "zcash_history"
bench = false

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(zcash_unstable, values("nutachyon"))']
