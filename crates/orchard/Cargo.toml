[package]
name = "zakura-orchard"
description = "The Orchard shielded transaction protocol"
keywords = ["cryptography", "orchard", "zero-knowledge", "zcash"]
categories = ["cryptography::cryptocurrencies"]
exclude = ["/AGENTS.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
features = ["test-dependencies", "unstable-frost", "weighted-merkle"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "orchard"
bench = false

[dependencies]
orchard-legacy = { workspace = true, optional = true }
maybe-rayon = { version = "0.1.0", default-features = false, optional = true }
plotters = { version = "0.3.0", optional = true }
aes = { version = "0.9", optional = true }
bitvec = { version = "1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
corez = { version = "0.1.1", features = ["alloc"], default-features = false }
fpe = { version = "0.7", features = ["alloc"], default-features = false, optional = true }
getset = "0.1"
hex = { version = "0.4", features = ["alloc"], default-features = false }
incrementalmerkletree = "0.8.1"
nonempty = { version = "0.11", default-features = false }
once_cell = { version = "1", features = ["race", "alloc"], default-features = false }
proptest = { version = ">=1.0.0, <1.7.0", optional = true }
rand = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
subtle = { version = "2.6", default-features = false }
tracing = { version = "0.1", default-features = false }
visibility = { version = "0.1.1", optional = true }
zcash_note_encryption = { workspace = true, features = ["alloc"] }
zcash_spec = "0.2.1"
zip32 = { version = "0.2.0", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
hex = "0.4"
incrementalmerkletree = { version = "0.8.1", features = ["test-dependencies"] }
proptest = ">=1.0.0, <1.7.0"
rand = { version = "0.10", features = ["thread_rng"], default-features = false }
rand_chacha = "0.10"
rayon = "1"
shardtree = "0.6"

zcash_note_encryption = { workspace = true, features = ["alloc", "pre-zip-212"] }

[target."cfg(unix)".dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[features]
backend-halo2 = ["dep:orchard-legacy"]
# Wallet key derivation and spending transaction construction, enabled by default.
wallet = ["dep:zip32"]
# Indexed ZIP 32 addresses and diversifier-index recovery, enabled by default.
zip32-addresses = ["wallet", "dep:aes", "dep:fpe"]
circuit = ["prover", "verifier"]
prover = ["std", "orchard-legacy?/circuit"]
verifier = ["std", "orchard-legacy?/circuit"]
default = ["backend-halo2", "wallet", "zip32-addresses", "circuit", "multicore", "std"]
dev-graph = ["orchard-legacy?/dev-graph", "image", "plotters"]
# Retained for compatibility with the former unused optional dependency.
image = []
multicore = ["orchard-legacy?/multicore", "dep:maybe-rayon", "maybe-rayon/threads"]
orbits = ["orchard-legacy?/orbits"]
# Disable automatic x86-64 assembly selection in the proving dependencies.
portable = ["orchard-legacy?/portable"]
std = ["corez/std", "orchard-legacy?/std"]
test-dependencies = ["wallet", "orchard-legacy?/test-dependencies", "proptest", "rand/std", "rand/std_rng"]
unstable-frost = ["dep:visibility"]
# Historical fingerprint fixtures use ZIP 32 indexed addresses.
verifier-fingerprint = ["orchard-legacy?/verifier-fingerprint", "zip32-addresses", "circuit"]
# Retained feature alias; historical formal-model tapes are replayed in tests.
prover-fingerprint = ["orchard-legacy?/prover-fingerprint", "zip32-addresses", "circuit"]
circuit-fixtures = ["orchard-legacy?/circuit-fixtures", "circuit"]
weighted-merkle = []
x86_64-asm = ["orchard-legacy?/x86_64-asm"]
aarch64-asm = ["orchard-legacy?/aarch64-asm"]

[[test]]
name = "ironwood_batch_timings"
required-features = ["test-dependencies", "circuit", "zip32-addresses"]

[[bench]]
name = "circuit"
harness = false
required-features = ["test-dependencies", "circuit", "zip32-addresses"]

[[bench]]
name = "note_decryption"
harness = false
required-features = ["test-dependencies", "circuit", "zip32-addresses"]

[[bench]]
name = "small"
harness = false
required-features = ["test-dependencies", "zip32-addresses"]

[[bench]]
name = "merkle"
harness = false
required-features = ["test-dependencies"]

[[bench]]
name = "ironwood_k11_prover"
harness = false
required-features = ["test-dependencies", "circuit", "zip32-addresses"]

[[bench]]
name = "post_nu6_3_k11_keygen"
harness = false
required-features = ["test-dependencies", "circuit", "zip32-addresses"]
