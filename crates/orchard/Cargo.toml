[package]
name = "zakura-orchard"
description = "The Orchard shielded transaction protocol"
keywords = ["cryptography", "orchard", "zero-knowledge", "zcash"]
categories = ["cryptography::cryptocurrencies"]
exclude = ["/AGENTS.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lib]
name = "orchard"
bench = false

[dependencies]
aes = { version = "0.8", optional = true }
bitvec = { version = "1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
corez = { version = "0.1.1", features = ["alloc"], default-features = false }
ff = { version = "0.14", default-features = false }
fpe = { version = "0.6", features = ["alloc"], default-features = false, optional = true }
getset = "0.1"
group = "0.14"
halo2_gadgets = { workspace = true, optional = true }
halo2_proofs = { workspace = true, features = ["batch", "floor-planner-v1-legacy-pdqsort"], optional = true }
hex = { version = "0.4", features = ["alloc"], default-features = false }
incrementalmerkletree = "0.8.1"
memuse = { version = "0.2.2", default-features = false }
maybe-rayon = { version = "0.1.0", default-features = false, optional = true }
nonempty = { version = "0.11", default-features = false }
once_cell = { version = "1", features = ["race", "alloc"], default-features = false }
pasta_curves = { workspace = true, features = ["default", "glv"] }
plotters = { version = "0.3.0", optional = true }
poseidon = { workspace = true }
proptest = { version = ">=1.0.0, <1.7.0", optional = true }
rand = { version = "0.10", default-features = false }
rand_core_06 = { version = "0.6", default-features = false, package = "rand_core" }
reddsa = { workspace = true }
serde = { version = "1.0", features = ["derive"], default-features = false }
sinsemilla = { workspace = true }
subtle = { version = "2.6", default-features = false }
tracing = { version = "0.1", default-features = false }
visibility = { version = "0.1.1", optional = true }
zcash_note_encryption = "0.4.2"
zcash_spec = "0.2.1"
zip32 = { version = "0.2.0", default-features = false }

[dev-dependencies]
criterion = "0.5"
halo2_gadgets = { workspace = true, features = ["test-dependencies"] }
hex = "0.4"
incrementalmerkletree = { version = "0.8.1", features = ["test-dependencies"] }
proptest = ">=1.0.0, <1.7.0"
rand = { version = "0.10", features = ["thread_rng"], default-features = false }
rand_chacha = "0.10"
rayon = "1"
shardtree = "0.6"
sinsemilla = { workspace = true, features = ["test-dependencies"] }
zcash_note_encryption = { version = "0.4.2", features = ["pre-zip-212"] }

[target."cfg(unix)".dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[features]
# Indexed ZIP 32 addresses and diversifier-index recovery, enabled by default.
zip32-addresses = ["dep:aes", "dep:fpe"]
circuit = ["dep:halo2_gadgets", "dep:halo2_proofs", "std"]
default = ["zip32-addresses", "circuit", "multicore", "std"]
dev-graph = ["halo2_proofs?/dev-graph", "image", "plotters"]
# Retained for compatibility with the former unused optional dependency.
image = []
multicore = ["halo2_proofs?/multicore", "dep:maybe-rayon", "maybe-rayon/threads"]
orbits = ["halo2_proofs?/orbits"]
# Disable automatic x86-64 assembly selection in the proving dependencies.
portable = ["pasta_curves/portable", "halo2_proofs?/portable"]
std = ["corez/std", "group/wnaf-memuse", "reddsa/std"]
test-dependencies = ["proptest", "rand/std", "rand/std_rng"]
unstable-frost = ["dep:visibility"]
unstable-voting-circuits = ["dep:visibility"]
# Historical fingerprint fixtures use ZIP 32 indexed addresses.
verifier-fingerprint = ["zip32-addresses", "circuit", "halo2_proofs/unstable-verifier-fingerprint"]
# Capture the prover's private tape and complete transcript for formal-model fixtures.
prover-fingerprint = ["zip32-addresses", "circuit", "halo2_proofs/unstable-prover-fingerprint"]
circuit-fixtures = ["circuit", "halo2_proofs/unstable-circuit-fixtures"]
weighted-merkle = []
x86_64-asm = ["pasta_curves/x86_64-asm", "halo2_proofs?/x86_64-asm"]

[[example]]
name = "generate_lagrange_coeffs"
required-features = ["circuit", "unstable-voting-circuits"]

[[test]]
name = "ironwood_batch_timings"
required-features = ["circuit", "zip32-addresses"]

[[bench]]
name = "circuit"
harness = false
required-features = ["circuit", "zip32-addresses"]

[[bench]]
name = "note_decryption"
harness = false
required-features = ["circuit", "zip32-addresses"]

[[bench]]
name = "small"
harness = false
required-features = ["zip32-addresses"]

[[bench]]
name = "merkle"
harness = false

[[bench]]
name = "ironwood_k11_prover"
harness = false
required-features = ["circuit", "zip32-addresses"]

[[bench]]
name = "post_nu6_3_k11_keygen"
harness = false
required-features = ["circuit", "zip32-addresses"]
